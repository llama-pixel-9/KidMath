yle=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-size:14px; line-height:1.5\">Bugles, and every other bird looks up. Leads the autumn V.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent\"><span style=\"display:inline-block; background:#FBC7A8; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Autumn<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.2\">Painted Bunting<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#FBC7A8; color:#14231F; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Rare<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; display:flex; align-items:center; gap:7px\"><span style=\"width:11px; height:11px; background:#F26B3A; border-radius:2px; transform:rotate(45deg); flex:none\"><\u002Fspan><span style=\"font-weight:700; font-size:14px\">110<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-size:14px; line-height:1.5\">Preens in the open. Tap him and he turns to show a different colour.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#FBC7A8; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Summer<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.2\">American Kestrel<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent\"><span style=\"display:inline-block; background:#FBC7A8; color:#14231F; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Rare<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; display:flex; align-items:center; gap:7px\"><span style=\"width:11px; height:11px; background:#F26B3A; border-radius:2px; transform:rotate(45deg); flex:none\"><\u002Fspan><span style=\"font-weight:700; font-size:14px\">120<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-size:14px; line-height:1.5\">Hovers dead still, then stoops. Nearby birds scatter when she lands.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent\"><span style=\"display:inline-block; background:#14231F0a; color:#14231F99; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">All year<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.2\">Snowy Owl<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#FBC7A8; color:#14231F; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Rare<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; display:flex; align-items:center; gap:7px\"><span style=\"width:11px; height:11px; background:#F26B3A; border-radius:2px; transform:rotate(45deg); flex:none\"><\u002Fspan><span style=\"font-weight:700; font-size:14px\">125<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-size:14px; line-height:1.5\">Sits through the snow without blinking. Hunts in daylight, unlike any other owl here.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#FBC7A8; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Winter<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.2\">Whooping Crane<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent\"><span style=\"display:inline-block; background:#064A41; color:#FFFBEB; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Legendary<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; display:flex; align-items:center; gap:7px\"><span style=\"font-weight:700; font-size:13px; color:#14231F99\">Egg<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-size:14px; line-height:1.5\">Dances — a ten-second display that stops the meadow to watch.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent\"><span style=\"display:inline-block; background:#14231F0a; color:#14231F99; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">All year<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.2\">California Condor<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#064A41; color:#FFFBEB; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Legendary<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; display:flex; align-items:center; gap:7px\"><span style=\"font-weight:700; font-size:13px; color:#14231F99\">Egg<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-size:14px; line-height:1.5\">Opens wings wider than a door and rides a thermal out of frame and back.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#14231F0a; color:#14231F99; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">All year<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; gap:16px; flex-wrap:wrap\">\n    <span style=\"background:#FFFBEB; border:2px solid #14231F1a; border-radius:14px; padding:12px 18px; font-weight:700; font-size:15px\">8 common · the first fortnight<\u002Fspan>\n    <span style=\"background:#A7DED3; border-radius:14px; padding:12px 18px; font-weight:700; font-size:15px\">7 uncommon · one bespoke move each<\u002Fspan>\n    <span style=\"background:#FBC7A8; border-radius:14px; padding:12px 18px; font-weight:700; font-size:15px\">5 rare · move, tap response, own hour<\u002Fspan>\n    <span style=\"background:#064A41; color:#FFFBEB; border-radius:14px; padding:12px 18px; font-weight:700; font-size:15px\">2 legendary · eggs only, named by the kid<\u002Fspan>\n    <span style=\"background:#FFFBEB; border:2px solid #C4471B; border-radius:14px; padding:12px 18px; font-weight:700; font-size:15px; color:#C4471B\">6 seasonal · the only empty perches<\u002Fspan>\n  <\u002Fdiv>\n\n  <ul style=\"margin:0; padding-left:20px; font-size:15px; line-height:1.7; max-width:74ch\">\n    <li><strong>The Skylark is not bought.<\u002Fstrong> She is there on day one, she is the guide's first plate, and she is the voice of every nomination — the one bird a kid never has to earn.<\u002Fli>\n    <li><strong>Seasonal birds can be given a home only while they are here<\u002Fstrong>, and they return the same time each year. The store says “back next summer”, never a countdown.<\u002Fli>\n    <li><strong>Seven per zone is a display cap, not a roster cap.<\u002Fstrong> Twenty-two birds spread comfortably across four zones with room left over; if the roster grows past that, the cap moves to eight before a fifth zone is drawn.<\u002Fli>\n    <li><strong>Every entry needs the same six things from the illustrator and the writer:<\u002Fstrong> a portrait, three scales, an idle pose, its tier's behaviour rig, a real call recording, and four true facts ending hopeful.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<sc-if value=\"{{ showMotionSpec }}\" hint-placeholder-val=\"{{ true }}\">\n<div id=\"s14\" style=\"padding:56px 64px; display:flex; flex-direction:column; gap:22px; border-bottom:2px solid #14231F1a\">\n  <div style=\"display:flex; align-items:baseline; gap:14px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:#14231F80\">14<\u002Fspan>\n    <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px\">Every animation in the Meadow<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:16px; line-height:1.6; max-width:74ch\">Three tiers: ambient loops that never stop, responses to a tap, and ceremonies that play once. Nothing bounces aggressively, nothing flashes, nothing loops in sync with anything else.<\u002Fp>\n\n  <div style=\"max-width:1240px; border:2px solid #14231F14; border-radius:18px; overflow:hidden\">\n    <div style=\"display:grid; grid-template-columns:190px 130px 160px 1fr; background:#14231F; color:#FFFBEB; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em\">\n      <span style=\"padding:11px 14px\">ANIMATION<\u002Fspan><span style=\"padding:11px 14px\">DURATION<\u002Fspan><span style=\"padding:11px 14px\">EASING<\u002Fspan><span style=\"padding:11px 14px\">WHAT MOVES<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"background:#A7DED3; padding:9px 14px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; color:#064A41\">TIER 1 · AMBIENT · ALWAYS RUNNING, NEVER IN SYNC<\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:190px 130px 160px 1fr; font-size:14px; line-height:1.5\">\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f\">Cloud drift<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">26s loop<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">ease-in-out alt<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">Cloud group translates ±26px on X. Two groups at different speeds.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f; background:#14231F05\">Canopy sway<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">9s loop<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">ease-in-out alt<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">Whole tree rotates ±1.1° around its base. Perched birds ride it.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f\">Grass sway<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">6s loop<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">ease-in-out alt<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">Foreground tufts rotate ±1.1° from the ground.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f; background:#14231F05\">Pond ripple<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">7s loop<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">ease-in-out alt<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">Water scales 0.97→1.03 on X at 75→100% opacity. Frozen in winter.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f\">Bird idle bob<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">4–6s loop<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">ease-in-out alt<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">−5px on Y. Period and delay randomised per bird at placement and saved, so the flock never pulses together.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f; background:#14231F05\">Play loops<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">6–10s<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">ease-in-out<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">Splash 8s, peck 6s, bath shake 10s, dust ruffle 7s. One bird per spot; a second waits on its perch.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f\">Signature moves<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">2–4s<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">ease-in-out<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">Uncommon and rarer only, 3–4 times a session at random intervals of at least 90s. Dive, drum, loop, hover.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f; background:#14231F05\">Season particle<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">16–28s loop<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">linear<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">3–5 sprites fall and drift. Max 5 on screen; snow slowest, petals fastest.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"background:#FBC7A8; padding:9px 14px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; color:#14231F99\">TIER 2 · RESPONSE · SOMETHING THE KID DID<\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:190px 130px 160px 1fr; font-size:14px; line-height:1.5\">\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f\">Bird tap hop<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">200ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">cubic-bezier(.34,1.3,.64,1)<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">−14px up and back, 2° tilt. Idle bob pauses and resumes. A rare bird answers with its signature move instead.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f; background:#14231F05\">Call bubble<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">160 / 900 / 200ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">ease-out, ease-in<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">Name-and-call bubble rises 8px and fades in, holds, fades. Audio starts with the rise.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f\">Guide sheet in<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">260ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">cubic-bezier(.2,.8,.2,1)<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">560px sheet translates in from the right edge. Out is the same curve at 200ms.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f; background:#14231F05\">Scene shift<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">300ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">ease-in-out<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">Scene translates left only as far as needed to keep the tapped bird clear of the sheet, max 180px. Runs with the sheet, not after.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f\">Scene dim<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">200ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">linear<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">Ink overlay to 12%. Ambient loops keep running underneath.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f; background:#14231F05\">Guide drawer<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">320ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">cubic-bezier(.2,.9,.25,1)<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">Drawer travels from the 78px handle to 82% height. Drag follows the finger 1:1 and snaps past 40%.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f\">Entry swap<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">180ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">ease-out<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">Old entry fades to 0, new fades in with a 6px rise. The plate slot never collapses, so nothing jumps.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f; background:#14231F05\">Zone pan<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">600ms / 240ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">ease-in-out<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">Chip tap pans 600ms; a released drag settles 240ms. Against the hedge, a 120ms 40px rubber-band.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"background:#0B7A6A; padding:9px 14px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; color:#FFFBEB\">TIER 3 · CEREMONY · ONCE, AND IT EARNS THE TIME<\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:190px 130px 160px 1fr; font-size:14px; line-height:1.5\">\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f\">Stars into the Nest<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">600ms ×14, 40ms apart<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">ease-in-out<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">On arriving from a Flight Report, one Sun diamond per star arcs from the top of the screen into the Nest. Capped at 14 sprites; above that the count runs faster.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f; background:#14231F05\">Nest count-up<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">800ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">ease-out<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">Balance ticks up, ending as the last diamond lands. Nest scales 1→1.06→1 on the final number.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f\">Bird arrives<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">1200ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">ease-out<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">After “Give a home”: the drawer closes, the bird flies in from off-screen along a shallow arc, lands in its saved perch, hops once, and its name bubble holds 2s. This is the receipt.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f; background:#14231F05\">Egg warms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">700ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">ease-out<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">Warmth bar fills to the new value. At 25 / 50 / 75% a crack line draws on in 300ms with a 3px shiver.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f\">Hatch<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">6 beats, ~9s<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">ease-in-out<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">Rock and crack 1.5s → chick at 0.6 scale, scene dims 30% 1.5s → naming → first flight 2s → entry. Skippable from beat 2.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f; background:#14231F05\">Departure<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">3000ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">ease-in-out<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">Lift off, one circle of the zone, then join a V of silhouettes crossing the sky. Perch stays empty and reserved.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f\">Zone opens<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">1500ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">ease-in-out<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">Sign swings 400ms → hedge parts 500ms → camera pans through 600ms → new chip slides into the rail. Once per zone, ever.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f; background:#14231F05\">Season turns<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">1500ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">ease-in-out<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\">Canopy and ground cross-fade to the new tint; the new particle starts as the old one finishes falling. First open of the quarter only.<\u002Fspan>\n      <span style=\"padding:11px 14px; font-weight:700; border-top:1px solid #14231F0f\">Day turns to night<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">2000ms<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">linear<\u002Fspan><span style=\"padding:11px 14px; border-top:1px solid #14231F0f\">Tint cross-fades if the app is open across the boundary; otherwise the scene is already night on open. Birds settle, the owl wakes.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <ul style=\"margin:0; padding-left:20px; font-size:15px; line-height:1.7; max-width:74ch\">\n    <li>Only one tier-3 animation plays at a time. If a flight earns stars <em>and<\u002Fem> hatches an egg, the stars land first and the hatch waits for the tap.<\u002Fli>\n    <li>Every ceremony is skippable with a tap except the 600ms of stars landing, which is short enough not to need it.<\u002Fli>\n    <li><strong>Reduced motion:<\u002Fstrong> tier 1 off, tier 2 becomes a 120ms opacity fade with no movement, tier 3 becomes a still frame with the same copy. The Meadow stays fully usable and nothing is hidden.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"padding:56px 64px 72px; display:flex; flex-direction:column; gap:20px; background:#064A41; color:#FFFBEB\">\n  <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:30px\">Still open<\u002Fh2>\n  <ul style=\"margin:0; padding-left:20px; font-size:16px; line-height:1.75; max-width:78ch; color:#A7DED3\">\n    <li><strong style=\"color:#FFFBEB\">The bird roster art is the blocker.<\u002Fstrong> Nothing here ships without a style guide and a commission: 4 zone scenes painted once in summer, 3 retint sets, 4 particle sprites, 1 hedge-and-sign, and 22 birds at 3 scales with per-tier behaviour rigs.<\u002Fli>\n    <li><strong style=\"color:#FFFBEB\">Rare behaviour is the budget question.<\u002Fstrong> A hover plus a tap response plus a dusk variant is roughly three times a common bird's animation work. If that is too much for release one, the tap response is the piece to defer.<\u002Fli>\n    <li><strong style=\"color:#FFFBEB\">Parent FAQ needs two lines:<\u002Fstrong> birds leaving is seasonal and temporary and no bird is ever lost; and stars cannot be bought, at any price.<\u002Fli>\n    <li><strong style=\"color:#FFFBEB\">Preset names need a decision:<\u002Fstrong> six curated names per species, drawn at random — is there a parent-side way to reroll one, or is the given name simply the bird's name?<\u002Fli>\n    <li><strong style=\"color:#FFFBEB\">Spring arrivals<\u002Fstrong> of the summer visitors are currently silent. They should probably get the same arrival flight the departures get a send-off.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;starBalance&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:128,&quot;min&quot;:0,&quot;max&quot;:400,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showSpecs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Document&quot;},&quot;showMotionSpec&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Document&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      starBalance: this.props.starBalance ?? 128,\n      showSpecs: this.props.showSpecs ?? true,\n      showMotionSpec: this.props.showMotionSpec ?? true,\n      primary: '#0B7A6A',\n      accent: '#F26B3A',\n      s26: 26,\n      s32: 32,\n      s72: 72,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
