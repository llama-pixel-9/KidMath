<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 -64 90 74">
<g stroke-linejoin="round" stroke-linecap="round">
  <!-- feathered legs + toes -->
  <g stroke="#C9A876" stroke-width="1.8" fill="none">
    <path d="M -4.5 -5.5 L -4 -1 M -4 -1 L -1.4 -0.2 M -4 -1 L -5.2 0.2 M -4 -1 L -6.8 -0.2"/>
    <path d="M 5.5 -5.5 L 5 -1 M 5 -1 L 7.6 -0.2 M 5 -1 L 3.8 0.2 M 5 -1 L 2.2 -0.2"/>
  </g>
  <path d="M -7 -4.8 Q -4.5 -8.2 -2 -4.8 Z M 3 -4.8 Q 5.5 -8.2 8 -4.8 Z"
        fill="#F8F2E4" stroke="#14231F" stroke-width="1.1"/>
  <!-- body (v0.1 base) -->
  <path d="M -10 -22 Q -11 -36 0 -39 Q 11 -36 10.5 -22 Q 10 -10 0 -5.5 Q -9.5 -10 -10 -22 Z"
        fill="#DDB77E" stroke="#14231F" stroke-width="1.6"/>
  <!-- white breast -->
  <path d="M -6.5 -20 Q -6 -8.5 0 -6 Q 6.5 -9 6.8 -20 Q 3 -25 0 -25 Q -3.5 -25 -6.5 -20 Z"
        fill="#F8F2E4" stroke="none"/>
  <g fill="#C9A876"><circle cx="-2.5" cy="-17" r="0.8"/><circle cx="2.5" cy="-14" r="0.8"/>
  <circle cx="-1" cy="-11" r="0.8"/><circle cx="3.5" cy="-19" r="0.8"/><circle cx="-4" cy="-13.5" r="0.8"/></g>
  <!-- folded wing edge + pearl spots -->
  <path d="M -10 -23 Q -8 -14 -3.5 -9 Q -8.5 -12 -10 -23 Z" fill="#C9A05E" stroke="none"/>
  <g fill="#8A6A50"><circle cx="-8.2" cy="-20" r="0.7"/><circle cx="-7.2" cy="-15.5" r="0.7"/><circle cx="-5.6" cy="-11.5" r="0.7"/></g>
  <!-- head -->
  <circle cx="1" cy="-38" r="9.6" fill="#DDB77E" stroke="#14231F" stroke-width="1.6"/>
  <!-- blend patch: owl has no neck — merge head into shoulders -->
  <path d="M -7.5 -33.5 Q 1 -37.5 9 -33.5 Q 8.5 -28.5 1 -27.5 Q -6.5 -28.5 -7.5 -33.5 Z"
        fill="#DDB77E" stroke="none"/>
  <!-- white heart face, buff rim -->
  <path d="M 1 -30.5 Q -7.5 -34 -6 -41 Q -5 -45.5 1 -45.2 Q 7 -45.5 8 -41 Q 9.5 -34 1 -30.5 Z"
        fill="#FFFDF4" stroke="#B98A5F" stroke-width="1.4"/>
  <!-- almond dark eyes -->
  <ellipse cx="-2.6" cy="-39" rx="1.8" ry="2.2" fill="#14231F" transform="rotate(-8 -2.6 -39)"/>
  <ellipse cx="4.6" cy="-39" rx="1.8" ry="2.2" fill="#14231F" transform="rotate(8 4.6 -39)"/>
  <circle cx="-2" cy="-39.7" r="0.55" fill="#FFFFFF"/>
  <circle cx="5.2" cy="-39.7" r="0.55" fill="#FFFFFF"/>
  <!-- small hooked beak -->
  <path d="M 1 -37.8 Q 2.6 -36.6 1 -34 Q -0.6 -36.6 1 -37.8 Z" fill="#E8CFA5" stroke="#14231F" stroke-width="1"/>
</g>
</svg>
