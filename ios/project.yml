# XcodeGen spec — the .xcodeproj is generated, not committed.
# Regenerate after changing this file or adding/removing sources:
#   cd ios && xcodegen generate
name: KidMath
options:
  bundleIdPrefix: io.larkit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FSFK6BL44U # Larkit Labs LLC — set here so xcodegen never loses it
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    majorVersion: 2.0.0
  # Native Google Sign-In: the consent sheet carries the Larkit brand and no
  # Supabase host (the same fix the web made with Google Identity Services).
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    majorVersion: 8.0.0

targets:
  KidMath:
    type: application
    platform: iOS
    sources:
      - path: KidMath
        excludes:
          - "Resources/**"
      # The engine bundle is a build artifact (npm run build:engine), gitignored.
      - path: KidMath/Resources
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
    # Entitlements are hand-managed files (not XcodeGen-generated) because
    # Debug and Release differ: Debug carries the StoreKit-testing key.
    # Release: KidMath/KidMath.entitlements · Debug: KidMathDebug.entitlements
    info:
      path: KidMath/Info.plist
      properties:
        # Home-screen label. The target stays KidMath (renaming it would ripple
        # through TEST_HOST and @testable imports); the user-facing name is larkit.
        CFBundleDisplayName: larkit
        # The system's own sheets ("“larkit” Wants to Use accounts.google.com
        # to Sign In", permission prompts) read CFBundleName, not the display
        # name — without this they said "KidMath".
        CFBundleName: larkit
        UILaunchScreen:
          UIColorName: LaunchBackground
        # HTTPS only (standard crypto) — skips the export-compliance question
        # on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # Bundled Google Fonts (OFL), same families the web loads: Fredoka for
        # display, Nunito for body. The alt-theme fonts left with the themes.
        UIAppFonts:
          - Fredoka.ttf
          - Nunito-Regular.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
        UISupportedInterfaceOrientations~iphone:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # kidmath://auth-callback — kept for any Supabase-redirect OAuth (none
        # today; Apple and Google both use signInWithIdToken).
        # The second scheme is the Google iOS client's reversed id: the Google
        # Sign-In SDK returns to the app on it.
        CFBundleURLTypes:
          - CFBundleURLName: auth-callback
            CFBundleURLSchemes: [kidmath]
          - CFBundleURLName: google-signin
            CFBundleURLSchemes: [com.googleusercontent.apps.978428509112-pfgifb9cskjosp959kjbpcdma05afvv8]
        # The iOS OAuth client (Google Cloud project under nagasai@larkit.io,
        # created 2026-09-26). An iOS client has no secret; the bundle id binds it.
        GIDClientID: 978428509112-pfgifb9cskjosp959kjbpcdma05afvv8.apps.googleusercontent.com
    preBuildScripts:
      - name: Check engine bundle
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "${SRCROOT}/KidMath/Resources/KidMathEngine.bundle.js" ]; then
            echo "error: KidMathEngine.bundle.js missing — run 'npm run build:engine' at the repo root first."
            exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.larkit.app # registered 2026-09-19 (App Store Connect app "larkit")
        GENERATE_INFOPLIST_FILE: NO # explicit Info.plist above (URL scheme needs a real file)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug adds the StoreKit-testing entitlement (SKTestSession needs it)
        # — on the SIMULATOR only: a device provisioning profile cannot carry
        # it, and a Debug run on a real iPad failed to sign until this split.
        # Release keeps the clean production entitlements everywhere.
        Debug:
          CODE_SIGN_ENTITLEMENTS: KidMath/KidMath.entitlements
          CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: KidMath/KidMathDebug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: KidMath/KidMath.entitlements

  KidMathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KidMathTests
      # StoreKitTest sessions load the same local store config the run scheme uses.
      - path: KidMath/KidMath.storekit
        buildPhase: resources
    dependencies:
      - target: KidMath
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KidMath.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/KidMath"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  KidMath:
    build:
      targets:
        KidMath: all
    run:
      config: Debug
      # Local StoreKit config: purchases/trials testable in the simulator
      # before any App Store Connect setup exists.
      storeKitConfiguration: KidMath/KidMath.storekit
    test:
      config: Debug
      storeKitConfiguration: KidMath/KidMath.storekit
      targets:
        - KidMathTests
