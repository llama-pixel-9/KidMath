<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 61 52" style="display:block; overflow:visible" role="img" aria-label="larkit">
  <defs>
    <clipPath id="larkBody"><circle cx="30" cy="32" r="18"></circle></clipPath>
  </defs>
  <path d="M27,24 C19,18 9,12 2,6 C5,18 8,31 15,42 C20,36 24,29 27,24 Z" fill="{{ color }}" style="{{ wingStyle }}"></path>
  <path d="M25,17 C24,10 27,5 31,3 C31,9 33,14 35,18 Z" fill="{{ color }}"></path>
  <circle cx="30" cy="32" r="18" fill="{{ color }}"></circle>
  <path d="M44,22 L61,26 L44,31 Z" fill="{{ accent }}"></path>
  <g clip-path="url(#larkBody)">
    <path d="M14,32 L37,40 L21,48 Z" fill="{{ accent }}"></path>
  </g>
  <circle cx="39" cy="24" r="{{ eyeR }}" fill="{{ eye }}"></circle>
</svg>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:160,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:16,&quot;max&quot;:512},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0B7A6A&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F26B3A&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eye&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFFBEB&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eyeR&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:2.6,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:6,&quot;step&quot;:0.2}}">
class Component extends DCLogic {
  renderVals() {
    return {
      size: this.props.size ?? 160,
      color: this.props.color ?? '#0B7A6A',
      accent: this.props.accent ?? '#F26B3A',
      eye: this.props.eye ?? '#FFFBEB',
      eyeR: this.props.eyeR ?? 2.6,
      wingStyle: this.props.flap ? { transformOrigin: '27px 24px', animation: 'larkFlap 780ms ease-in-out infinite' } : undefined
    };
  }
}
</script>
</body>
</html>
