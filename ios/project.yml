# XcodeGen spec — the .xcodeproj is generated, not committed.
# Regenerate after changing this file or adding/removing sources:
#   cd ios && xcodegen generate
name: KidMath
options:
  bundleIdPrefix: com.kidmath
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    majorVersion: 2.0.0

targets:
  KidMath:
    type: application
    platform: iOS
    sources:
      - path: KidMath
        excludes:
          - "Resources/**"
      # The engine bundle is a build artifact (npm run build:engine), gitignored.
      - path: KidMath/Resources
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    # Entitlements are hand-managed files (not XcodeGen-generated) because
    # Debug and Release differ: Debug carries the StoreKit-testing key.
    # Release: KidMath/KidMath.entitlements · Debug: KidMathDebug.entitlements
    info:
      path: KidMath/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        # HTTPS only (standard crypto) — skips the export-compliance question
        # on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # Bundled Google Fonts (OFL), same families the web loads in index.css.
        UIAppFonts:
          - Fredoka.ttf
          - PressStart2P.ttf
          - MedievalSharp.ttf
          - Silkscreen.ttf
          - Bungee.ttf
        UISupportedInterfaceOrientations~iphone:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # OAuth (Google via Supabase) redirects back into the app on this scheme.
        CFBundleURLTypes:
          - CFBundleURLName: auth-callback
            CFBundleURLSchemes: [kidmath]
    preBuildScripts:
      - name: Check engine bundle
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "${SRCROOT}/KidMath/Resources/KidMathEngine.bundle.js" ]; then
            echo "error: KidMathEngine.bundle.js missing — run 'npm run build:engine' at the repo root first."
            exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kidmath.app # placeholder — set the real ID before App Store Connect
        GENERATE_INFOPLIST_FILE: NO # explicit Info.plist above (URL scheme needs a real file)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug adds the StoreKit-testing entitlement (SKTestSession needs it);
        # Release keeps the clean production entitlements.
        Debug:
          CODE_SIGN_ENTITLEMENTS: KidMath/KidMathDebug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: KidMath/KidMath.entitlements

  KidMathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KidMathTests
      # StoreKitTest sessions load the same local store config the run scheme uses.
      - path: KidMath/KidMath.storekit
        buildPhase: resources
    dependencies:
      - target: KidMath
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KidMath.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/KidMath"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  KidMath:
    build:
      targets:
        KidMath: all
    run:
      config: Debug
      # Local StoreKit config: purchases/trials testable in the simulator
      # before any App Store Connect setup exists.
      storeKitConfiguration: KidMath/KidMath.storekit
    test:
      config: Debug
      storeKitConfiguration: KidMath/KidMath.storekit
      targets:
        - KidMathTests
