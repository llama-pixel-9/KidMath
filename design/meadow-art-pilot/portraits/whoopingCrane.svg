<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <rect width="300" height="400" fill="#FFFDF4"/>
  <rect x="10" y="10" width="280" height="380" rx="14" fill="none" stroke="#14231F" stroke-width="2.5"/>
  <rect x="20" y="20" width="260" height="296" rx="10" fill="#DCEFE7"/>
  <!-- distant meadow line -->
  <path d="M 20 268 Q 90 258 150 266 T 280 264 V 316 H 20 Z" fill="#BFE3D6"/>
  <!-- branch from the left with leaf sprigs -->
  <path d="M 20 292 C 70 288 120 290 158 291" stroke="#B08968" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 60 289 q -6 -12 3 -18 q 7 10 -3 18 Z M 104 288 q -4 -13 6 -17 q 5 11 -6 17 Z"
        fill="#7FCFBE" stroke="#3E9E8E" stroke-width="1.2"/>
  <!-- soft ground shadow -->
  <ellipse cx="150" cy="293" rx="46" ry="6" fill="#14231F" opacity="0.08"/>
  <g transform="translate(150,291) scale(2.23)">
<g stroke-linejoin="round" stroke-linecap="round">
  <!-- long legs + toes -->
  <g stroke="#3A3F3B" stroke-width="2" fill="none">
    <path d="M -6 -26 C -6.6 -18 -6.2 -8.5 -5.4 -1 M -5.4 -1 L -1.8 -0.2 M -5.4 -1 L -6.8 0.4 M -5.4 -1 L -9 -0.2"/>
    <path d="M 7.5 -26 C 7.1 -18 7.3 -8.5 7.9 -1 M 7.9 -1 L 11.5 -0.2 M 7.9 -1 L 6.5 0.4 M 7.9 -1 L 4.3 -0.2"/>
  </g>
  <!-- white body (v0.1 base) -->
  <path d="M -17 -34 Q -17 -46 -5 -48 Q 9 -49.5 14 -41 Q 17.5 -34 13.5 -28 Q 8 -22.5 -3 -23.5 Q -14 -25.5 -17 -34 Z"
        fill="#FCFAF2" stroke="#14231F" stroke-width="1.6"/>
  <!-- soft wing shading -->
  <path d="M -13 -37.5 Q -4 -43.5 6 -40.5 Q 3 -31.5 -6.5 -30.5 Q -12 -32.5 -13 -37.5 Z"
        fill="#EDE7D6" stroke="none"/>
  <!-- black primaries drooping over the tail, wavy plume tips -->
  <path d="M -12.5 -45 C -18.5 -47 -23.5 -44.5 -24.6 -39.5
           C -25.2 -35.5 -23.6 -31.5 -20.8 -28.5
           L -19.4 -31.2 L -17.8 -28.8 L -16.4 -31.4 L -15 -29.4
           C -13.6 -34.5 -13 -40 -12.5 -45 Z"
        fill="#20262B" stroke="#14231F" stroke-width="1.4"/>
  <g stroke="#3A424A" stroke-width="1.3" fill="none">
    <path d="M -18 -42.5 C -21.5 -41.5 -23 -38.5 -22.4 -34.5"/>
    <path d="M -16 -39 C -18 -37 -18.6 -34.2 -18 -31.4"/>
  </g>
  <!-- neck: slim S-curve (v0.1 base) -->
  <path d="M 11 -42 Q 17 -46 16.5 -58 Q 16 -70 18 -78 L 23.5 -77 Q 21.5 -68 22 -58 Q 22.5 -44 14.5 -37.5 Z"
        fill="#FCFAF2" stroke="#14231F" stroke-width="1.6"/>
  <!-- head -->
  <circle cx="21.5" cy="-80" r="6.2" fill="#FCFAF2" stroke="#14231F" stroke-width="1.6"/>
  <!-- blend patch: hides the neck/head seam -->
  <path d="M 17.2 -79.5 Q 20 -82.5 24 -80 Q 23.4 -76.5 20.2 -76.2 Q 17.8 -77.5 17.2 -79.5 Z"
        fill="#FCFAF2" stroke="none"/>
  <!-- red crown down the forehead -->
  <path d="M 16.4 -83.2 C 18.2 -86.4 22.2 -87.4 25.4 -85.4 C 24.4 -83.6 22.6 -82.4 20.4 -82.2
           C 18.8 -82.1 17.4 -82.5 16.4 -83.2 Z"
        fill="#D93A2B" stroke="#14231F" stroke-width="1.1"/>
  <!-- dark mustache -->
  <path d="M 18.4 -80 C 20.8 -81.2 23.8 -81 26 -79.6 C 24.4 -77.6 21.6 -77.2 19.4 -78.2
           C 18.9 -78.8 18.6 -79.4 18.4 -80 Z" fill="#4A3F3A" stroke="none"/>
  <!-- long straight beak, two mandibles -->
  <path d="M 27.3 -80.4 L 38.6 -77.9 L 27.5 -76.5 C 27 -77.8 27 -79.1 27.3 -80.4 Z"
        fill="#6E5A46" stroke="#14231F" stroke-width="1.05"/>
  <path d="M 27.4 -78.3 L 38.6 -77.9" stroke="#14231F" stroke-width="0.75" fill="none"/>
  <!-- golden eye -->
  <circle cx="23.6" cy="-81.2" r="1.6" fill="#E8B33A" stroke="#14231F" stroke-width="0.8"/>
  <circle cx="24.15" cy="-81.75" r="0.48" fill="#FFFFFF"/>
</g></g>
  <text x="30" y="42" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="2"
        fill="#14231F88">PLATE 21</text>
  <text x="150" y="349" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="24"
        font-weight="600" fill="#14231F">Whooping Crane</text>
  <text x="150" y="370" text-anchor="middle" font-family="Nunito, sans-serif" font-style="italic"
        font-size="13" fill="#14231F99">Grus americana</text>
</svg>
