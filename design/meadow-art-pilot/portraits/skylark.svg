<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <rect width="300" height="400" fill="#FFFDF4"/>
  <rect x="10" y="10" width="280" height="380" rx="14" fill="none" stroke="#14231F" stroke-width="2.5"/>
  <rect x="20" y="20" width="260" height="296" rx="10" fill="#DCEFE7"/>
  <!-- distant meadow line -->
  <path d="M 20 268 Q 90 258 150 266 T 280 264 V 316 H 20 Z" fill="#BFE3D6"/>
  <!-- branch from the left with leaf sprigs -->
  <path d="M 20 292 C 70 288 120 290 158 291" stroke="#B08968" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 60 289 q -6 -12 3 -18 q 7 10 -3 18 Z M 104 288 q -4 -13 6 -17 q 5 11 -6 17 Z"
        fill="#7FCFBE" stroke="#3E9E8E" stroke-width="1.2"/>
  <!-- soft ground shadow -->
  <ellipse cx="150" cy="293" rx="46" ry="6" fill="#14231F" opacity="0.08"/>
  <g transform="translate(150,291) scale(3.17)">
<g stroke-linejoin="round" stroke-linecap="round">
  <!-- legs + toes (long hind claw) -->
  <g stroke="#B98A5F" stroke-width="1.8" fill="none">
    <path d="M -2.5 -7.5 L -1.5 -1 M -1.5 -1 L 1.6 -0.2 M -1.5 -1 L -2.8 0.2 M -1.5 -1 L -5.4 -0.3"/>
    <path d="M 6 -7.8 L 6.8 -1 M 6.8 -1 L 9.9 -0.2 M 6.8 -1 L 5.5 0.2 M 6.8 -1 L 3 -0.3"/>
  </g>
  <!-- tail: two feathers -->
  <path d="M -22.5 -22.5 L -11 -17.5 L -12 -12 L -20.5 -16.5 Z" fill="#8A6A50" stroke="#14231F" stroke-width="1.5"/>
  <path d="M -19.5 -19.8 L -12.5 -16.2" stroke="#6E5138" stroke-width="1.1" fill="none"/>
  <!-- body (v0.1 round base) -->
  <path d="M -13 -15 Q -14 -24 -5 -27 Q 6 -30 12 -24 Q 16 -19 14 -13 Q 11 -7 2 -6.5 Q -8 -6.5 -13 -15 Z"
        fill="#D9B98A" stroke="#14231F" stroke-width="1.6"/>
  <!-- cream belly -->
  <path d="M -8 -9.5 Q 0 -5.5 9 -9.5 Q 12 -12 12 -15 Q 4 -10.5 -6 -12.5 Z" fill="#F6ECD9" stroke="none"/>
  <!-- head -->
  <circle cx="12" cy="-28" r="7.2" fill="#D9B98A" stroke="#14231F" stroke-width="1.6"/>
  <!-- blend patch: hides the head/body seam -->
  <path d="M 5.6 -26.6 Q 10.5 -29.5 14.5 -25.5 Q 13.5 -21.5 9 -20.8 Q 6 -23 5.6 -26.6 Z"
        fill="#D9B98A" stroke="none"/>
  <!-- folded wing (v0.1 teardrop) + tucked primary hints -->
  <path d="M -11 -19 Q -3 -25 6 -22 Q 3 -14 -5 -13 Q -10 -14 -11 -19 Z"
        fill="#B9905F" stroke="#14231F" stroke-width="1.2"/>
  <g stroke="#8A6448" stroke-width="2.3" fill="none">
    <path d="M -6.5 -14.8 C -10 -15.2 -13 -16.2 -15.5 -17.6"/>
  </g>
  <path d="M -8 -17.5 L 1 -20 M -7 -15 L 2 -17" stroke="#6E5138" stroke-width="1.1" fill="none"/>
  <!-- crest tuft -->
  <path d="M 9 -34.6 L 10.2 -38.2 L 11.8 -34.7 Z M 12.4 -34.7 L 14 -37.6 L 15 -34 Z"
        fill="#B9905F" stroke="#14231F" stroke-width="1.2"/>
  <!-- cream eyebrow -->
  <path d="M 8.5 -30.5 Q 12.5 -32.5 16.5 -30" stroke="#F6ECD9" stroke-width="1.7" fill="none"/>
  <!-- beak: two mandibles -->
  <path d="M 18.6 -29.2 L 24.5 -27.9 L 18.7 -27.1 Z" fill="#C79A5B" stroke="#14231F" stroke-width="1.05"/>
  <path d="M 18.7 -26.9 L 23.3 -26.5 L 18.7 -25.7 Z" fill="#B08448" stroke="#14231F" stroke-width="1.05"/>
  <!-- eye -->
  <circle cx="14.2" cy="-29" r="1.75" fill="#14231F"/>
  <circle cx="14.85" cy="-29.65" r="0.58" fill="#FFFFFF"/>
</g></g>
  <text x="30" y="42" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="2"
        fill="#14231F88">PLATE 01</text>
  <text x="150" y="349" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="24"
        font-weight="600" fill="#14231F">Skylark</text>
  <text x="150" y="370" text-anchor="middle" font-family="Nunito, sans-serif" font-style="italic"
        font-size="13" fill="#14231F99">Alauda arvensis</text>
</svg>
