document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:Nunito,sans-serif; color:#14231F; background:#FFFBEB\">\n\n<div style=\"padding:64px 64px 44px; display:flex; flex-direction:column; gap:22px; border-bottom:3px solid #14231F\">\n  <div style=\"display:flex; align-items:center; gap:12px; flex-wrap:wrap\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; background:#0B7A6A; color:#FFFBEB; border-radius:999px; padding:5px 12px\">FINAL · BUILD AGAINST THIS<\u002Fspan>\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; color:#14231F99\">LARKIT · GAMIFICATION · STARS, THE MEADOW AND THE FLOCK<\u002Fspan>\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; border:1.5px solid #C4471B; color:#C4471B; border-radius:999px; padding:5px 12px\">ALL BIRD ART IS A ROUGH SKETCH<\u002Fspan>\n  <\u002Fdiv>\n  <h1 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:56px; line-height:1; max-width:22ch\">Stars, the Meadow, and the Flock<\u002Fh1>\n  <p style=\"margin:0; font-size:19px; line-height:1.55; max-width:70ch; text-wrap:pretty\">The complete gamification design, consolidated from every decision made so far. A kid flies, earns stars for how carefully they flew, and spends them giving real birds a home in a meadow that is theirs. Nothing is bought with money, nothing is taken away, and nothing here gates the maths.<\u002Fp>\n  <div style=\"display:flex; gap:12px; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em; color:#14231F99\">\n    <span style=\"border:1.5px solid #14231F1a; border-radius:999px; padding:6px 12px\">01 THE ECONOMY<\u002Fspan>\n    <span style=\"border:1.5px solid #14231F1a; border-radius:999px; padding:6px 12px\">02 FLIGHT REPORT<\u002Fspan>\n    <span style=\"border:1.5px solid #14231F1a; border-radius:999px; padding:6px 12px\">03 FLEDGING<\u002Fspan>\n    <span style=\"border:1.5px solid #14231F1a; border-radius:999px; padding:6px 12px\">04 THE MEADOW<\u002Fspan>\n    <span style=\"border:1.5px solid #14231F1a; border-radius:999px; padding:6px 12px\">05 ZONES<\u002Fspan>\n    <span style=\"border:1.5px solid #14231F1a; border-radius:999px; padding:6px 12px\">06 PERCHES<\u002Fspan>\n    <span style=\"border:1.5px solid #14231F1a; border-radius:999px; padding:6px 12px\">07 FIELD GUIDE<\u002Fspan>\n    <span style=\"border:1.5px solid #14231F1a; border-radius:999px; padding:6px 12px\">08 GIVE A HOME<\u002Fspan>\n    <span style=\"border:1.5px solid #14231F1a; border-radius:999px; padding:6px 12px\">09 RARITY<\u002Fspan>\n    <span style=\"border:1.5px solid #14231F1a; border-radius:999px; padding:6px 12px\">10 HATCHING<\u002Fspan>\n    <span style=\"border:1.5px solid #14231F1a; border-radius:999px; padding:6px 12px\">11 LEAVING<\u002Fspan>\n    <span style=\"border:1.5px solid #14231F1a; border-radius:999px; padding:6px 12px\">12 SEASONS<\u002Fspan>\n    <span style=\"border:1.5px solid #14231F1a; border-radius:999px; padding:6px 12px\">13 ROSTER<\u002Fspan>\n    <span style=\"border:1.5px solid #14231F1a; border-radius:999px; padding:6px 12px\">14 MOTION<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:44px 64px; display:grid; grid-template-columns:repeat(3,1fr); gap:18px; background:#A7DED3; border-bottom:3px solid #14231F\">\n  <div style=\"background:#FFFBEB; border-radius:18px; padding:20px\">\n    <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">RULE 01<\u002Fspan>\n    <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:21px; margin-top:6px; line-height:1.15\">Stars reward care, not volume<\u002Fspan>\n    <span style=\"display:block; font-size:15px; line-height:1.55; margin-top:7px\">Getting it right first time pays more than grinding. Levels are earned by mastery and cannot be bought.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"background:#FFFBEB; border-radius:18px; padding:20px\">\n    <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">RULE 02<\u002Fspan>\n    <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:21px; margin-top:6px; line-height:1.15\">Nothing is ever taken away<\u002Fspan>\n    <span style=\"display:block; font-size:15px; line-height:1.55; margin-top:7px\">No streak loss, no decay, no expiry. The one empty perch a kid sees belongs to a migrant, and she comes back.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"background:#FFFBEB; border-radius:18px; padding:20px\">\n    <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">RULE 03<\u002Fspan>\n    <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:21px; margin-top:6px; line-height:1.15\">The birds are real<\u002Fspan>\n    <span style=\"display:block; font-size:15px; line-height:1.55; margin-top:7px\">Every species exists, every fact is true, and the Field Guide is about the animal — never about the kid's copy of it.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"background:#FFFBEB; border-radius:18px; padding:20px\">\n    <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">RULE 04<\u002Fspan>\n    <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:21px; margin-top:6px; line-height:1.15\">Nothing nags<\u002Fspan>\n    <span style=\"display:block; font-size:15px; line-height:1.55; margin-top:7px\">No notifications, no badges, no timers, no “you missed it”. The kestrel hovers whether or not anyone is watching.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"background:#FFFBEB; border-radius:18px; padding:20px\">\n    <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">RULE 05<\u002Fspan>\n    <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:21px; margin-top:6px; line-height:1.15\">Collection never gates maths<\u002Fspan>\n    <span style=\"display:block; font-size:15px; line-height:1.55; margin-top:7px\">Every game mode is open regardless of the flock. Birds are what the flying is <em>for<\u002Fem>, never a key to it.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"background:#064A41; border-radius:18px; padding:20px\">\n    <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#A7DED3\">RULE 06<\u002Fspan>\n    <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:21px; margin-top:6px; line-height:1.15; color:#FFFBEB\">Stars are the only currency<\u002Fspan>\n    <span style=\"display:block; font-size:15px; line-height:1.55; margin-top:7px; color:#A7DED3\">Nothing in the Meadow can be bought with money, at any price, ever. Plus unlocks modes and flight logs, never birds.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"s01\" style=\"padding:56px 64px; display:flex; flex-direction:column; gap:22px; border-bottom:2px solid #14231F1a\">\n  <div style=\"display:flex; align-items:baseline; gap:14px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:#14231F80\">01<\u002Fspan>\n    <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px\">The economy<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:16px; line-height:1.6; max-width:74ch\">Four payouts, settled at the end of every flight. A kid who answers ten questions carefully out-earns a kid who rushes twenty, and the report says so in words a six-year-old can read.<\u002Fp>\n  <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:16px\">\n    <div style=\"background:#FFFFFF; border-radius:18px; box-shadow:0 6px 0 #14231F0f; padding:20px\">\n      <span style=\"display:flex; align-items:center; gap:9px\"><span style=\"width:14px; height:14px; background:#F26B3A; border-radius:3px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:22px\">Landing<\u002Fspan><\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:30px; color:#0B7A6A; margin-top:10px\">+2<\u002Fspan>\n      <span style=\"display:block; font-size:15px; line-height:1.5; margin-top:6px\">You finished. Paid for completing a flight of any length, at any accuracy.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF; border-radius:18px; box-shadow:0 6px 0 #14231F0f; padding:20px\">\n      <span style=\"display:flex; align-items:center; gap:9px\"><span style=\"width:14px; height:14px; background:#F26B3A; border-radius:3px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:22px\">Precision<\u002Fspan><\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:30px; color:#0B7A6A; margin-top:10px\">+1 each<\u002Fspan>\n      <span style=\"display:block; font-size:15px; line-height:1.5; margin-top:6px\">One star per question right on the first try. The bulk of any payout, and the reason care beats speed.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF; border-radius:18px; box-shadow:0 6px 0 #14231F0f; padding:20px\">\n      <span style=\"display:flex; align-items:center; gap:9px\"><span style=\"width:14px; height:14px; background:#F26B3A; border-radius:3px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:22px\">Altitude<\u002Fspan><\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:30px; color:#0B7A6A; margin-top:10px\">+0 to 4<\u002Fspan>\n      <span style=\"display:block; font-size:15px; line-height:1.5; margin-top:6px\">A bonus that grows with the level you are flying at, so harder skies stay worth the trip.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF; border-radius:18px; box-shadow:0 6px 0 #14231F0f; padding:20px\">\n      <span style=\"display:flex; align-items:center; gap:9px\"><span style=\"width:14px; height:14px; background:#F26B3A; border-radius:3px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:22px\">Circle-back<\u002Fspan><\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:30px; color:#0B7A6A; margin-top:10px\">+1 each<\u002Fspan>\n      <span style=\"display:block; font-size:15px; line-height:1.5; margin-top:6px\">For fixing something you got wrong in an earlier flight. The only payout for a mistake, and deliberately so.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex; gap:16px; flex-wrap:wrap\">\n    <span style=\"background:#FBC7A8; border-radius:14px; padding:12px 18px; font-weight:700; font-size:15px\">A typical good flight: 14–18 stars<\u002Fspan>\n    <span style=\"background:#FBC7A8; border-radius:14px; padding:12px 18px; font-weight:700; font-size:15px\">A common bird: 15–25<\u002Fspan>\n    <span style=\"background:#FBC7A8; border-radius:14px; padding:12px 18px; font-weight:700; font-size:15px\">A rare bird: 90–130, about a week<\u002Fspan>\n    <span style=\"background:#A7DED3; border-radius:14px; padding:12px 18px; font-weight:700; font-size:15px\">Levels cost nothing — they are flown for, not bought<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"s02\" style=\"padding:56px 64px; display:flex; flex-direction:column; gap:22px; border-bottom:2px solid #14231F1a; background:#14231F08\">\n  <div style=\"display:flex; align-items:baseline; gap:14px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:#14231F80\">02<\u002Fspan>\n    <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px\">The Flight Report<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:16px; line-height:1.6; max-width:74ch\">The existing end card, retuned. Ring, lark, pun headline, Apricot strip, teal button and text link are unchanged. Only the strip's contents and the slot beneath it are new — and that slot has three states.<\u002Fp>\n  <div style=\"display:flex; gap:26px; flex-wrap:wrap\">\n\n    <div style=\"display:flex; flex-direction:column; gap:12px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; color:#14231F80\">STATE 1 · ORDINARY FLIGHT<\u002Fspan>\n      <div style=\"width:380px; background:#FFFFFF; border-radius:24px; box-shadow:0 8px 0 #14231F14; padding:30px 28px; display:flex; flex-direction:column; align-items:center; gap:15px; box-sizing:border-box\">\n        <div style=\"position:relative; width:148px; height:148px; display:flex; align-items:center; justify-content:center\">\n          <div style=\"width:148px; height:148px; border-radius:50%; background:conic-gradient(#0B7A6A 0 87%, #14231F14 0); display:flex; align-items:center; justify-content:center\">\n            <div style=\"width:120px; height:120px; border-radius:50%; background:#FFFFFF; display:flex; align-items:center; justify-content:center\">\n              <dc-import name=\"LarkMark\" size=\"{{ s72 }}\" color=\"{{ primary }}\" accent=\"{{ accent }}\" flap=\"yes\" hint-size=\"72px,72px\"><\u002Fdc-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute; bottom:-6px; background:#14231F; border-radius:999px; padding:5px 14px; font-family:Fredoka,sans-serif; font-weight:600; font-size:17px; color:#FFFBEB\">13 / 15<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:30px; margin-top:6px\">Talon-ted!<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:10px; background:#FBC7A8; border-radius:16px; padding:11px 16px\">\n          <span style=\"width:16px; height:16px; background:#F26B3A; border-radius:3px; transform:rotate(45deg); flex:none\"><\u002Fspan>\n          <span style=\"font-weight:700; font-size:15px\">+14 stars<\u002Fspan>\n          <span style=\"width:1px; height:18px; background:#14231F33; flex:none\"><\u002Fspan>\n          <span style=\"font-weight:700; font-size:15px\">4 day migration<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-weight:700; font-size:14px; color:#0B7A6A; text-decoration:underline; text-underline-offset:3px\">How did I get 14?<\u002Fspan>\n        <div style=\"width:100%; display:flex; flex-direction:column; gap:7px\">\n          <div style=\"height:14px; border-radius:999px; background:#14231F14; overflow:hidden\"><div style=\"width:70%; height:100%; border-radius:999px; background:#0B7A6A\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; font-weight:700; font-size:13px; color:#064A41\"><span>Level 3 · Flier<\u002Fspan><span>{{ starBalance }} in the Nest<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:100%; height:56px; border-radius:18px; background:#0B7A6A; box-shadow:0 5px 0 #064A41; display:flex; align-items:center; justify-content:center; font-family:Fredoka,sans-serif; font-weight:600; font-size:22px; color:#FFFBEB\">Play again<\u002Fdiv>\n        <div style=\"font-weight:700; font-size:15px; color:#0B7A6A\">Back to the nest<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showSpecs }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"width:380px; font-family:'IBM Plex Mono',monospace; font-size:11px; line-height:1.6; color:#14231F99\">Slot holds the level bar. Right label is the Nest total — the same number the Meadow tab shows. “N stars to Level 3” is gone; stars no longer buy levels.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column; gap:12px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; color:#C4471B\">STATE 2 · THE LARK NOMINATES<\u002Fspan>\n      <div style=\"width:380px; background:#FFFFFF; border-radius:24px; box-shadow:0 8px 0 #14231F14; padding:30px 28px; display:flex; flex-direction:column; align-items:center; gap:15px; box-sizing:border-box\">\n        <div style=\"position:relative; width:148px; height:148px; display:flex; align-items:center; justify-content:center\">\n          <div style=\"width:148px; height:148px; border-radius:50%; background:conic-gradient(#0B7A6A 0 93%, #14231F14 0); display:flex; align-items:center; justify-content:center\">\n            <div style=\"width:120px; height:120px; border-radius:50%; background:#FFFFFF; display:flex; align-items:center; justify-content:center\">\n              <dc-import name=\"LarkMark\" size=\"{{ s72 }}\" color=\"{{ primary }}\" accent=\"{{ accent }}\" flap=\"yes\" hint-size=\"72px,72px\"><\u002Fdc-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute; bottom:-6px; background:#14231F; border-radius:999px; padding:5px 14px; font-family:Fredoka,sans-serif; font-weight:600; font-size:17px; color:#FFFBEB\">14 / 15<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:30px; margin-top:6px\">That soared!<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:10px; background:#FBC7A8; border-radius:16px; padding:11px 16px\">\n          <span style=\"width:16px; height:16px; background:#F26B3A; border-radius:3px; transform:rotate(45deg); flex:none\"><\u002Fspan>\n          <span style=\"font-weight:700; font-size:15px\">+16 stars<\u002Fspan>\n          <span style=\"width:1px; height:18px; background:#14231F33; flex:none\"><\u002Fspan>\n          <span style=\"font-weight:700; font-size:15px\">5 day migration<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-weight:700; font-size:14px; color:#0B7A6A; text-decoration:underline; text-underline-offset:3px\">How did I get 16?<\u002Fspan>\n        <div style=\"width:100%; background:#A7DED3; border-radius:16px; padding:13px 16px; display:flex; align-items:center; gap:13px; box-sizing:border-box\">\n          <span style=\"width:40px; height:40px; border-radius:11px; background:#FFFBEB; flex:none; display:flex; align-items:center; justify-content:center\">\n            <dc-import name=\"LarkMark\" size=\"{{ s26 }}\" color=\"{{ primary }}\" accent=\"{{ accent }}\" hint-size=\"26px,26px\"><\u002Fdc-import>\n          <\u002Fspan>\n          <span style=\"flex:1\">\n            <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:17px; line-height:1.15\">Ready for higher skies<\u002Fspan>\n            <span style=\"display:block; font-size:13px; line-height:1.4; font-weight:600; margin-top:2px\">Next time, six questions to reach Level 4.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:100%; height:56px; border-radius:18px; background:#0B7A6A; box-shadow:0 5px 0 #064A41; display:flex; align-items:center; justify-content:center; font-family:Fredoka,sans-serif; font-weight:600; font-size:22px; color:#FFFBEB\">Play again<\u002Fdiv>\n        <div style=\"font-weight:700; font-size:15px; color:#0B7A6A\">Back to the nest<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showSpecs }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"width:380px; font-family:'IBM Plex Mono',monospace; font-size:11px; line-height:1.6; color:#14231F99\">Same slot, Seafoam note, lark at 26px. Never a modal and never a blocking offer — this is news, and the Fledging Flight is proposed at the start of the next session. Note is 84px against the bar's 39px, so the card grows ~45px: the container must not be fixed-height (517 → 562px).<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column; gap:12px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; color:#14231F80\">STATE 3 · “HOW DID I GET 14?”<\u002Fspan>\n      <div style=\"width:380px; background:#FFFFFF; border-radius:24px; box-shadow:0 8px 0 #14231F14; padding:30px 28px; display:flex; flex-direction:column; align-items:center; gap:14px; box-sizing:border-box\">\n        <div style=\"position:relative; width:148px; height:148px; display:flex; align-items:center; justify-content:center\">\n          <div style=\"width:148px; height:148px; border-radius:50%; background:conic-gradient(#0B7A6A 0 87%, #14231F14 0); display:flex; align-items:center; justify-content:center\">\n            <div style=\"width:120px; height:120px; border-radius:50%; background:#FFFFFF; display:flex; align-items:center; justify-content:center\">\n              <dc-import name=\"LarkMark\" size=\"{{ s72 }}\" color=\"{{ primary }}\" accent=\"{{ accent }}\" flap=\"yes\" hint-size=\"72px,72px\"><\u002Fdc-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute; bottom:-6px; background:#14231F; border-radius:999px; padding:5px 14px; font-family:Fredoka,sans-serif; font-weight:600; font-size:17px; color:#FFFBEB\">13 / 15<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:30px; margin-top:6px\">Talon-ted!<\u002Fdiv>\n        <div style=\"width:100%; background:#FBC7A8; border-radius:16px; padding:13px 16px; display:flex; flex-direction:column; box-sizing:border-box\">\n          <div style=\"display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #14231F1f\"><span style=\"font-weight:700; font-size:14px\">You finished<\u002Fspan><span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:15px\">+2<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #14231F1f\"><span style=\"font-weight:700; font-size:14px\">13 right first try<\u002Fspan><span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:15px\">+9<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #14231F1f\"><span style=\"font-weight:700; font-size:14px\">Flier skies<\u002Fspan><span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:15px\">+2<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; padding:5px 0\"><span style=\"font-weight:700; font-size:14px\">Old miss fixed<\u002Fspan><span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:15px\">+1<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; align-items:center; margin-top:7px; padding-top:8px; border-top:2px solid #14231F26\">\n            <span style=\"display:flex; align-items:center; gap:9px\"><span style=\"width:15px; height:15px; background:#F26B3A; border-radius:3px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-weight:700; font-size:15px\">Into the Nest<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:19px\">+14<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-weight:700; font-size:14px; color:#0B7A6A; text-decoration:underline; text-underline-offset:3px\">Hide<\u002Fspan>\n        <div style=\"width:100%; height:56px; border-radius:18px; background:#0B7A6A; box-shadow:0 5px 0 #064A41; display:flex; align-items:center; justify-content:center; font-family:Fredoka,sans-serif; font-weight:600; font-size:22px; color:#FFFBEB\">Play again<\u002Fdiv>\n        <div style=\"font-weight:700; font-size:15px; color:#0B7A6A\">Back to the nest<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showSpecs }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"width:380px; font-family:'IBM Plex Mono',monospace; font-size:11px; line-height:1.6; color:#14231F99\">The strip grows downward into the four reasons on the same Apricot surface, so it reads as one object opening rather than a new panel. Collapsed by default from the second week on.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"s03\" style=\"padding:56px 64px; display:flex; flex-direction:column; gap:22px; border-bottom:2px solid #14231F1a\">\n  <div style=\"display:flex; align-items:baseline; gap:14px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:#14231F80\">03<\u002Fspan>\n    <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px\">Fledging — how a kid levels up<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:16px; line-height:1.6; max-width:74ch\">Levels are not bought and not automatic. The lark nominates a kid who is flying well, and they choose whether to take the test. Declining costs nothing and the offer comes back.<\u002Fp>\n  <div style=\"display:flex; gap:14px; flex-wrap:wrap\">\n    <div style=\"flex:1; min-width:210px; background:#FFFFFF; border-radius:16px; box-shadow:0 5px 0 #14231F0f; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">STEP 1<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:5px; line-height:1.15\">Earned mid-flight<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.5; margin-top:6px\">Nothing interrupts the round. The flag is set silently when accuracy holds high across several flights.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:210px; background:#FFFFFF; border-radius:16px; box-shadow:0 5px 0 #14231F0f; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">STEP 2<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:5px; line-height:1.15\">Announced on the report<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.5; margin-top:6px\">The Seafoam note in the level bar's slot — state 2 above. Read it or ignore it.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:210px; background:#FFFFFF; border-radius:16px; box-shadow:0 5px 0 #14231F0f; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">STEP 3<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:5px; line-height:1.15\">Carried on the Play card<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.5; margin-top:6px\">A Sun “Ready to fledge” pill on that mode's card at Home, so it survives leaving the app.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:210px; background:#FFFFFF; border-radius:16px; box-shadow:0 5px 0 #14231F0f; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">STEP 4<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:5px; line-height:1.15\">Offered at take-off<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.5; margin-top:6px\">Six questions, five to pass. No stars ride on it. “Just a normal flight today” is plain text, the same size as the copy.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:210px; background:#A7DED3; border-radius:16px; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#064A41\">STEP 5<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:5px; line-height:1.15\">Cleared<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.5; margin-top:6px\">By passing, by a rough flight, after three failed attempts, or on a glide down. Time away never costs it.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"s04\" style=\"padding:56px 64px; display:flex; flex-direction:column; gap:22px; border-bottom:2px solid #14231F1a; background:#14231F08\">\n  <div style=\"display:flex; align-items:baseline; gap:14px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:#14231F80\">04<\u002Fspan>\n    <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px\">The Meadow<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:16px; line-height:1.6; max-width:74ch\">A fourth tab on the perch, beside Home, Play and Worksheets. The scene owns the page; the Field Guide waits behind a handle at the bottom. This is the only frame on this page with live motion — everything drifts, nothing pulses in time with anything else.<\u002Fp>\n\n  <div style=\"width:1120px; flex:none; border-radius:26px; border:9px solid #14231F; overflow:hidden; box-sizing:border-box; display:flex; flex-direction:column; background:#FFFBEB\">\n    <div style=\"height:64px; background:#FFFFFF; box-shadow:0 3px 0 #14231F0f; padding:0 18px; display:flex; align-items:center; gap:16px; flex:none\">\n      <dc-import name=\"LarkMark\" size=\"{{ s32 }}\" color=\"{{ primary }}\" accent=\"{{ accent }}\" hint-size=\"32px,32px\"><\u002Fdc-import>\n      <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:24px; color:#0B7A6A; line-height:1\">larkit<\u002Fspan>\n
