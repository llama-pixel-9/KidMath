 24 -2\" fill=\"none\" stroke=\"#14231F\" stroke-width=\"2.2\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"position:absolute; bottom:150px; left:330px; animation:gm-bob 5s ease-in-out .9s infinite alternate\">\n        <svg width=\"56\" height=\"47\" sc-camel-view-box=\"0 0 62 52\"><ellipse cx=\"28\" cy=\"30\" rx=\"17\" ry=\"12\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.4\"><\u002Fellipse><circle cx=\"43\" cy=\"19\" r=\"8\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.4\"><\u002Fcircle><path d=\"M50 17 l9 3 -9 3z\" fill=\"#F26B3A\" stroke=\"#14231F\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M24 41 v7 M33 41 v7\" stroke=\"#14231F\" stroke-width=\"2.2\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"position:absolute; bottom:162px; left:250px; animation:gm-bob 4.2s ease-in-out 1.4s infinite alternate\">\n        <svg width=\"64\" height=\"54\" sc-camel-view-box=\"0 0 62 52\"><ellipse cx=\"28\" cy=\"30\" rx=\"17\" ry=\"12\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.4\"><\u002Fellipse><circle cx=\"43\" cy=\"19\" r=\"8\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.4\"><\u002Fcircle><path d=\"M50 17 l9 3 -9 3z\" fill=\"#F26B3A\" stroke=\"#14231F\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M24 41 v9 M33 41 v9\" stroke=\"#14231F\" stroke-width=\"2.2\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"position:absolute; bottom:214px; left:962px; animation:gm-bob 4.6s ease-in-out .2s infinite alternate\">\n        <svg width=\"52\" height=\"44\" sc-camel-view-box=\"0 0 62 52\"><ellipse cx=\"28\" cy=\"30\" rx=\"17\" ry=\"12\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.4\"><\u002Fellipse><circle cx=\"43\" cy=\"19\" r=\"8\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.4\"><\u002Fcircle><path d=\"M50 17 l9 3 -9 3z\" fill=\"#F26B3A\" stroke=\"#14231F\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M24 41 v7 M33 41 v7\" stroke=\"#14231F\" stroke-width=\"2.2\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n\n      <div style=\"position:absolute; top:20px; right:24px; display:flex; align-items:center; gap:8px\">\n        <span style=\"background:#FFFBEB; border-radius:999px; padding:8px 14px; font-family:Fredoka,sans-serif; font-weight:600; font-size:15px\">Meadow<\u002Fspan>\n        <span style=\"background:#FFFBEB99; border-radius:999px; padding:8px 14px; font-family:Fredoka,sans-serif; font-weight:600; font-size:15px\">Pond<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; color:#064A41\">2 PLACES YOU CAN VISIT<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"position:absolute; bottom:150px; right:120px; display:flex; align-items:center; gap:12px; background:#FFFBEBe6; border-radius:18px; padding:11px 14px\">\n        <svg width=\"40\" height=\"50\" sc-camel-view-box=\"0 0 40 50\"><path d=\"M20 3 C31 13 37 27 37 34 C37 43 29 48 20 48 C11 48 3 43 3 34 C3 27 9 13 20 3Z\" fill=\"#FFFBEB\" stroke=\"#C4471B\" stroke-width=\"2.4\"><\u002Fpath><path d=\"M8 30 l7 -5 6 6 6 -6 5 5\" fill=\"none\" stroke=\"#C4471B\" stroke-width=\"2\" opacity=\".6\"><\u002Fpath><\u002Fsvg>\n        <span>\n          <span style=\"display:block; font-weight:700; font-size:14px\">Crane egg · warm 60%<\u002Fspan>\n          <span style=\"display:block; margin-top:5px; height:9px; width:150px; border-radius:999px; background:#14231F1f; overflow:hidden\"><span style=\"display:block; width:60%; height:100%; background:#F26B3A\"><\u002Fspan><\u002Fspan>\n          <span style=\"display:block; margin-top:4px; font-size:12px; color:#14231F99\">Keep flying to keep it warm<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"position:absolute; left:0; right:0; bottom:0; height:78px; background:#FFFBEB; border-radius:22px 22px 0 0; box-shadow:0 -6px 0 #14231F14; padding:0 24px; display:flex; align-items:center; gap:18px; box-sizing:border-box\">\n        <span style=\"width:52px; height:5px; border-radius:999px; background:#14231F1f\"><\u002Fspan>\n        <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:21px\">Field Guide<\u002Fspan>\n        <span style=\"font-weight:700; font-size:15px; color:#14231F99\">7 of 22 birds<\u002Fspan>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <span style=\"font-weight:700; font-size:15px; color:#0B7A6A\">Pull up to open<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; gap:36px; flex-wrap:wrap; max-width:1120px\">\n    <ul style=\"margin:0; padding-left:20px; font-size:15px; line-height:1.7; flex:1; min-width:400px\">\n      <li><strong>The Nest hangs in the tree<\u002Fstrong> and holds the star balance. It is the only interface element drawn as scenery, and it never moves.<\u002Fli>\n      <li><strong>The egg sits on the grass<\u002Fstrong> at the horizon line, warming as the kid flies.<\u002Fli>\n      <li><strong>The right third stays clear<\u002Fstrong> — that is where the guide sheet lands and where the landscape continues into the next zone.<\u002Fli>\n    <\u002Ful>\n    <ul style=\"margin:0; padding-left:20px; font-size:15px; line-height:1.7; flex:1; min-width:400px\">\n      <li><strong>Tapping a bird<\u002Fstrong> makes it hop, plays its call, then opens its Field Guide entry from the right.<\u002Fli>\n      <li><strong>The guide handle is always visible<\u002Fstrong> at 78px and never overlaps a bird.<\u002Fli>\n      <li><strong>Reduced motion stops all of it.<\u002Fstrong> The scene is fully readable still, and that is the version the focus-friendly setting ships.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"s05\" style=\"padding:56px 64px; display:flex; flex-direction:column; gap:22px; border-bottom:2px solid #14231F1a\">\n  <div style=\"display:flex; align-items:baseline; gap:14px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:#14231F80\">05<\u002Fspan>\n    <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px\">Four zones, panned to the frontier<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:16px; line-height:1.6; max-width:74ch\">Four fixed illustrations on one shared horizon. A kid drags freely across every zone they have earned; the world ends at a hedge with a sign, and there is nothing rendered behind it. Zones open at 5, 10 and 15 birds.<\u002Fp>\n\n  <div style=\"width:1120px; flex:none; height:280px; border-radius:16px; border:4px solid #14231F; overflow:hidden; position:relative; background:#A7DED3\">\n    <svg sc-camel-view-box=\"0 0 1112 272\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute; inset:0; width:100%; height:100%\">\n      <rect width=\"1112\" height=\"272\" fill=\"#A7DED3\"><\u002Frect>\n      <path d=\"M0 146 C120 134 240 154 330 146 C440 136 530 156 640 146 C720 138 790 150 840 146 L840 272 L0 272Z\" fill=\"#6FC3B2\"><\u002Fpath>\n      <path d=\"M0 198 C160 186 310 204 480 194 C620 186 750 202 840 190 L840 272 L0 272Z\" fill=\"#8ED2C2\" opacity=\".55\"><\u002Fpath>\n      <path d=\"M132 152 C129 124 128 102 134 82 L146 82 C152 104 150 126 146 152Z\" fill=\"#C99A6B\"><\u002Fpath>\n      <ellipse cx=\"139\" cy=\"70\" rx=\"58\" ry=\"38\" fill=\"#6FC3B2\"><\u002Fellipse>\n      <ellipse cx=\"430\" cy=\"216\" rx=\"118\" ry=\"32\" fill=\"#A7DED3\" stroke=\"#064A41\" stroke-width=\"1.6\" opacity=\".85\"><\u002Fellipse>\n      <rect x=\"840\" y=\"86\" width=\"272\" height=\"186\" fill=\"#3E9E8E\"><\u002Frect>\n      <path d=\"M840 90 q30 -22 62 0 q30 -22 62 0 q30 -22 62 0 q30 -22 86 0\" fill=\"none\" stroke=\"#064A41\" stroke-width=\"5\"><\u002Fpath>\n    <\u002Fsvg>\n    <div style=\"position:absolute; top:58px; left:112px\"><svg width=\"40\" height=\"34\" sc-camel-view-box=\"0 0 62 52\"><ellipse cx=\"28\" cy=\"30\" rx=\"17\" ry=\"12\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.8\"><\u002Fellipse><circle cx=\"43\" cy=\"19\" r=\"8\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.8\"><\u002Fcircle><path d=\"M50 17 l9 3 -9 3z\" fill=\"#F26B3A\" stroke=\"#14231F\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n    <div style=\"position:absolute; top:116px; left:238px\"><svg width=\"36\" height=\"30\" sc-camel-view-box=\"0 0 62 52\"><ellipse cx=\"28\" cy=\"30\" rx=\"17\" ry=\"12\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"3\"><\u002Fellipse><circle cx=\"43\" cy=\"19\" r=\"8\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"3\"><\u002Fcircle><path d=\"M50 17 l9 3 -9 3z\" fill=\"#F26B3A\" stroke=\"#14231F\" stroke-width=\"2.2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n    <div style=\"position:absolute; top:166px; left:376px\"><svg width=\"42\" height=\"35\" sc-camel-view-box=\"0 0 62 52\"><ellipse cx=\"28\" cy=\"30\" rx=\"17\" ry=\"12\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.8\"><\u002Fellipse><circle cx=\"43\" cy=\"19\" r=\"8\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.8\"><\u002Fcircle><path d=\"M50 17 l9 3 -9 3z\" fill=\"#F26B3A\" stroke=\"#14231F\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n    <div style=\"position:absolute; top:142px; left:600px\"><svg width=\"36\" height=\"30\" sc-camel-view-box=\"0 0 62 52\"><ellipse cx=\"28\" cy=\"30\" rx=\"17\" ry=\"12\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"3\"><\u002Fellipse><circle cx=\"43\" cy=\"19\" r=\"8\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"3\"><\u002Fcircle><path d=\"M50 17 l9 3 -9 3z\" fill=\"#F26B3A\" stroke=\"#14231F\" stroke-width=\"2.2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n    <div style=\"position:absolute; inset:0; display:flex\">\n      <div style=\"width:38%; border-right:1.5px dashed #064A4166; display:flex; align-items:flex-end; padding:0 0 12px 16px\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; color:#064A41\">MEADOW · FROM THE START<\u002Fspan><\u002Fdiv>\n      <div style=\"width:38%; border-right:1.5px dashed #064A4166; display:flex; align-items:flex-end; padding:0 0 12px 16px\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; color:#064A41\">POND · EARNED AT 5<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1; display:flex; align-items:flex-end; padding:0 0 12px 16px\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; color:#FFFBEB\">HEDGE · HARD STOP<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:absolute; top:96px; right:40px; display:flex; flex-direction:column; align-items:center; gap:9px\">\n      <div style=\"background:#FFFBEB; border:2.5px solid #C99A6B; border-radius:10px; padding:9px 14px; text-align:center; box-shadow:0 4px 0 #C99A6B\">\n        <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.1\">The Woods<\u002Fspan>\n        <span style=\"display:block; font-weight:700; font-size:12px; color:#14231F99; margin-top:2px\">opens at 10 birds<\u002Fspan>\n        <span style=\"display:block; font-weight:700; font-size:12px; color:#0B7A6A; margin-top:2px\">3 more to go<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"width:5px; height:22px; background:#C99A6B\"><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; gap:36px; flex-wrap:wrap; max-width:1120px\">\n    <ul style=\"margin:0; padding-left:20px; font-size:15px; line-height:1.7; flex:1; min-width:400px\">\n      <li><strong>Free drag, 1:1 with the finger.<\u002Fstrong> Release inside a zone and it settles over 240ms; release mid-boundary and it snaps to whichever zone holds more of the screen.<\u002Fli>\n      <li><strong>Chips pan, they do not cut<\u002Fstrong> — 600ms, so the geography stays true.<\u002Fli>\n      <li><strong>The rail lists only places you can go.<\u002Fstrong> An unearned zone has no chip and no preview.<\u002Fli>\n    <\u002Ful>\n    <ul style=\"margin:0; padding-left:20px; font-size:15px; line-height:1.7; flex:1; min-width:400px\">\n      <li><strong>Drag against the hedge<\u002Fstrong> and the scene rubber-bands 40px and returns.<\u002Fli>\n      <li><strong>Opening a zone is the only scene change:<\u002Fstrong> the sign swings (400ms), the hedge parts (500ms), and the camera pans through (600ms). Once per zone, ever.<\u002Fli>\n      <li><strong>Birds are not tied to zones.<\u002Fstrong> A new arrival takes a free perch wherever the kid is; the seven-per-zone cap is only about how crowded a scene looks.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"s06\" style=\"padding:56px 64px; display:flex; flex-direction:column; gap:22px; border-bottom:2px solid #14231F1a; background:#14231F08\">\n  <div style=\"display:flex; align-items:baseline; gap:14px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:#14231F80\">06<\u002Fspan>\n    <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px\">Perches and play<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:16px; line-height:1.6; max-width:74ch\">Fourteen named perches per zone for a cap of seven birds, so the meadow never looks like assigned seating. A bird's saved slot is a perch, not a coordinate, which is why it is always in the same place tomorrow.<\u002Fp>\n  <div style=\"display:flex; gap:16px; flex-wrap:wrap\">\n    <div style=\"flex:1; min-width:280px; background:#FFFBEB; border:2px solid #14231F1a; border-radius:18px; padding:20px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">PERCHES · 14 PER ZONE<\u002Fspan>\n      <ul style=\"margin:10px 0 0; padding-left:20px; font-size:15px; line-height:1.7\">\n        <li>High branch ×2, low branch ×2, trunk hollow<\u002Fli>\n        <li>Reeds ×2, fence posts ×2, nest box, log<\u002Fli>\n        <li>Ground, and the pond edge<\u002Fli>\n      <\u002Ful>\n      <span style=\"display:block; font-size:14px; line-height:1.6; margin-top:10px; color:#14231F99\">Species choose the kind of perch that suits them — waders take reeds, perchers take branches, the owl takes the hollow. That is what makes a full meadow look right rather than random.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:280px; background:#FBC7A8; border-radius:18px; padding:20px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#C4471B\">PLAY SPOTS · 4 PER ZONE<\u002Fspan>\n      <ul style=\"margin:10px 0 0; padding-left:20px; font-size:15px; line-height:1.7\">\n        <li>The shallows — splash, 8s<\u002Fli>\n        <li>The feeder — peck, 6s<\u002Fli>\n        <li>The bird bath — shake, 10s<\u002Fli>\n        <li>The dust patch — ruffle, 7s<\u002Fli>\n      <\u002Ful>\n      <span style=\"display:block; font-size:14px; line-height:1.6; margin-top:10px\">A bird drifts to one every few minutes, uses it, and goes back to its perch. One bird at a time; a second waits. Tap a bird mid-play and it finishes the loop first — nothing is ever cut off mid-splash.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:280px; background:#A7DED3; border-radius:18px; padding:20px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#064A41\">PLACEMENT RULES<\u002Fspan>\n      <ul style=\"margin:10px 0 0; padding-left:20px; font-size:15px; line-height:1.7\">\n        <li>Chosen once, when the bird moves in, then saved forever<\u002Fli>\n        <li>Minimum 96px between neighbours<\u002Fli>\n        <li>Depth by band: sky 0.7 → canopy 0.85 → mid 1.0 → foreground 1.15<\u002Fli>\n        <li>The Nest, the egg and the guide handle are reserved rectangles and never picked<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"s07\" style=\"padding:56px 64px; display:flex; flex-direction:column; gap:22px; border-bottom:2px solid #14231F1a\">\n  <div style=\"display:flex; align-items:baseline; gap:14px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:#14231F80\">07<\u002Fspan>\n    <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px\">The Field Guide<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:16px; line-height:1.6; max-width:74ch\">Opened only by tapping a bird. One subject per sheet, entering from the right while the scene shifts just enough to keep the tapped bird visible beside it. It is about the real species and nothing else — no nickname, no perch, no tier, no join date.<\u002Fp>\n\n  <div style=\"display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start\">\n    <div style=\"width:560px; background:#FFFBEB; border:2px solid #14231F1a; border-radius:20px; padding:26px 28px; display:flex; flex-direction:column; gap:15px; box-sizing:border-box\">\n      <div style=\"display:flex; align-items:center; justify-content:space-between\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">FIELD GUIDE<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">PLATE 03 OF 22<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:206px; background:#A7DED3; border-radius:16px; display:flex; align-items:center; justify-content:center; position:relative\">\n        <svg width=\"150\" height=\"127\" sc-camel-view-box=\"0 0 62 52\"><ellipse cx=\"28\" cy=\"30\" rx=\"17\" ry=\"12\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"1.9\"><\u002Fellipse><circle cx=\"43\" cy=\"19\" r=\"8\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"1.9\"><\u002Fcircle><path d=\"M50 17 l9 3 -9 3z\" fill=\"#F26B3A\" stroke=\"#14231F\" stroke-width=\"1.3\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M16 26 q12 -12 24 -2\" fill=\"none\" stroke=\"#14231F\" stroke-width=\"1.6\"><\u002Fpath><path d=\"M12 33 q-9 3 -3 9\" fill=\"none\" stroke=\"#14231F\" stroke-width=\"1.6\"><\u002Fpath><path d=\"M24 41 v7 M33 41 v7\" stroke=\"#14231F\" stroke-width=\"1.6\"><\u002Fpath><\u002Fsvg>\n        <span style=\"position:absolute; bottom:9px; right:13px; font-family:'IBM Plex Mono',monospace; font-size:9px; color:#064A41\">SKETCH · PLATE SLOT<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:14px; border-bottom:3px solid #14231F; padding-bottom:11px\">\n        <span>\n          <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px; line-height:1.02\">Blue Jay<\u002Fspan>\n          <span style=\"display:block; font-weight:700; font-size:15px; color:#0B7A6A; margin-top:3px; font-style:italic\">Cyanocitta cristata<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"display:flex; align-items:center; gap:8px; background:#0B7A6A; color:#FFFBEB; border-radius:999px; padding:11px 17px; font-weight:700; font-size:14px; flex:none\">♪ Her call<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:18px; line-height:1.4; font-weight:700\">She copies a hawk's scream to scare other birds off the feeder.<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column\">\n        <div style=\"display:flex; gap:16px; align-items:baseline; padding:11px 0; border-bottom:1.5px solid #14231F14\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; color:#14231F80; width:104px; flex:none\">HOW BIG<\u002Fspan><span style=\"font-weight:700; font-size:15px; line-height:1.4\">About as long as your shoe<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:16px; align-items:baseline; padding:11px 0; border-bottom:1.5px solid #14231F14\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; color:#14231F80; width:104px; flex:none\">WHAT SHE EATS<\u002Fspan><span style=\"font-weight:700; font-size:15px; line-height:1.4\">Acorns — she plants oaks by accident<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:16px; align-items:baseline; padding:11px 0; border-bottom:1.5px solid #14231F14\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; color:#14231F80; width:104px; flex:none\">WHERE SHE LIVES<\u002Fspan><span style=\"font-weight:700; font-size:15px; line-height:1.4\">Oak woods and back gardens, right across the east<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:16px; align-items:baseline; padding:11px 0\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; color:#14231F80; width:104px; flex:none\">HOW SHE'S DOING<\u002Fspan><span style=\"font-weight:700; font-size:15px; line-height:1.4\">Thriving — more jays now than fifty years ago<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; justify-content:space-between; padding-top:12px; border-top:1.5px solid #14231F14\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; color:#14231F80\">A REAL BIRD · NOTHING ABOUT YOURS<\u002Fspan>\n        <span style=\"font-weight:700; font-size:14px; color:#0B7A6A\">Close<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <ul style=\"margin:0; padding-left:20px; font-size:15px; line-height:1.75; flex:1; min-width:340px\">\n      <li><strong>Four facts, always the same four,<\u002Fstrong> so a kid learns where to look. The conservation line ends hopeful in every single entry.<\u002Fli>\n      <li><strong>Names live in the meadow, not the book.<\u002Fstrong> Every bird arrives already called something — one of six curated names per species, drawn at random — and that name shows on the tap bubble and in the flock strip.<\u002Fli>\n      <li><strong>Hatched rarities are the exception:<\u002Fstrong> the kid names those at the Unveiling, and a permanent Rename sits in the entry's foot so they can change their mind later.<\u002Fli>\n      <li><strong>Tier tabs down the edge<\u002Fstrong> flip to the next entry without closing. Birds you have never met have no tab.<\u002Fli>\n      <li><strong>Formatting is what separates it from the store:<\u002Fstrong> one subject, a full-width plate, a 3px Ink rule under the name, ruled fact rows, flat — no cards, no shadows, no grid, no prices.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"s08\" style=\"padding:56px 64px; display:flex; flex-direction:column; gap:22px; border-bottom:2px solid #14231F1a; background:#14231F08\">\n  <div style=\"display:flex; align-items:baseline; gap:14px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:#14231F80\">08<\u002Fspan>\n    <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px\">Give a home<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:16px; line-height:1.6; max-width:74ch\">Never called a shop. A drawer pulled up from the bottom in the app's own card language — deliberately unlike the guide — showing two bands: what a kid can afford today, and what to keep flying for. One bird at a time, no basket, no bundles.<\u002Fp>\n\n  <div style=\"display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start\">\n    <div style=\"width:640px; background:#FFFBEB; border:2px solid #14231F1a; border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:16px; box-sizing:border-box\">\n      <div style=\"display:flex; align-items:center; gap:14px\">\n        <span style=\"width:52px; height:5px; border-radius:999px; background:#14231F1f\"><\u002Fspan>\n        <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:24px\">Give a home<\u002Fspan>\n        <span style=\"font-weight:700; font-size:14px; color:#14231F99\">15 birds looking for one<\u002Fspan>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <span style=\"display:flex; align-items:center; gap:8px; background:#FBC7A8; border-radius:999px; padding:6px 12px\"><span style=\"width:12px; height:12px; background:#F26B3A; border-radius:3px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-weight:700; font-size:14px\">{{ starBalance }}<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:7px; flex-wrap:wrap\">\n        <span style=\"background:#0B7A6A; color:#FFFBEB; border-radius:999px; padding:7px 13px; font-weight:700; font-size:12px; white-space:nowrap\">Everyone<\u002Fspan>\n        <span style=\"border:1.5px solid #14231F1f; border-radius:999px; padding:7px 13px; font-weight:700; font-size:12px; white-space:nowrap\">Common<\u002Fspan>\n        <span style=\"border:1.5px solid #14231F1f; border-radius:999px; padding:7px 13px; font-weight:700; font-size:12px; white-space:nowrap\">Uncommon<\u002Fspan>\n        <span style=\"border:1.5px solid #14231F1f; border-radius:999px; padding:7px 13px; font-weight:700; font-size:12px; white-space:nowrap\">Rare<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:12px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; color:#14231F80\">YOU CAN GIVE A HOME TODAY<\u002Fspan>\n        <span style=\"flex:1; height:1px; background:#14231F14\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:12px\">\n        <div style=\"background:#FFFFFF; border-radius:16px; box-shadow:0 5px 0 #14231F0f; padding:11px; display:flex; flex-direction:column; gap:7px\">\n          <span style=\"height:66px; border-radius:11px; background:#A7DED3; display:flex; align-items:center; justify-content:center\"><svg width=\"52\" height=\"44\" sc-camel-view-box=\"0 0 62 52\"><ellipse cx=\"28\" cy=\"30\" rx=\"17\" ry=\"12\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.6\"><\u002Fellipse><circle cx=\"43\" cy=\"19\" r=\"8\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.6\"><\u002Fcircle><path d=\"M50 17 l9 3 -9 3z\" fill=\"#F26B3A\" stroke=\"#14231F\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.1\">Chickadee<\u002Fspan>\n          <span style=\"font-size:12px; color:#14231F99; line-height:1.4\">Common · good company<\u002Fspan>\n          <span style=\"display:flex; align-items:center; gap:6px; background:#F26B3A; border-radius:999px; padding:4px 10px; align-self:flex-start\"><span style=\"width:10px; height:10px; background:#FFFBEB; border-radius:2px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-weight:700; font-size:13px; color:#FFFBEB\">18<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; border-radius:16px; box-shadow:0 5px 0 #14231F0f; padding:11px; display:flex; flex-direction:column; gap:7px; outline:2.5px solid #0B7A6A; outline-offset:-2.5px\">\n          <span style=\"height:66px; border-radius:11px; background:#A7DED3; display:flex; align-items:center; justify-content:center\"><svg width=\"56\" height=\"47\" sc-camel-view-box=\"0 0 62 52\"><ellipse cx=\"28\" cy=\"30\" rx=\"17\" ry=\"12\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.5\"><\u002Fellipse><circle cx=\"43\" cy=\"19\" r=\"8\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.5\"><\u002Fcircle><path d=\"M50 17 l9 3 -9 3z\" fill=\"#F26B3A\" stroke=\"#14231F\" stroke-width=\"1.7\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M16 26 q12 -12 24 -2\" fill=\"none\" stroke=\"#14231F\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.1\">Barn Owl<\u002Fspan>\n          <span style=\"font-size:12px; color:#14231F99; line-height:1.4\">Uncommon · hunts at dusk<\u002Fspan>\n          <span style=\"display:flex; align-items:center; gap:6px; background:#F26B3A; border-radius:999px; padding:4px 10px; align-self:flex-start\"><span style=\"width:10px; height:10px; background:#FFFBEB; border-radius:2px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-weight:700; font-size:13px; color:#FFFBEB\">55<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; border-radius:16px; box-shadow:0 5px 0 #14231F0f; padding:11px; display:flex; flex-direction:column; gap:7px\">\n          <span style=\"height:66px; border-radius:11px; background:#A7DED3; display:flex; align-items:center; justify-content:center\"><svg width=\"50\" height=\"42\" sc-camel-view-box=\"0 0 62 52\"><ellipse cx=\"28\" cy=\"30\" rx=\"17\" ry=\"12\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.7\"><\u002Fellipse><circle cx=\"43\" cy=\"19\" r=\"8\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.7\"><\u002Fcircle><path d=\"M50 17 l9 3 -9 3z\" fill=\"#F26B3A\" stroke=\"#14231F\" stroke-width=\"1.9\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.1\">Cardinal<\u002Fspan>\n          <span style=\"font-size:12px; color:#14231F99; line-height:1.4\">Common · good company<\u002Fspan>\n          <span style=\"display:flex; align-items:center; gap:6px; background:#F26B3A; border-radius:999px; padding:4px 10px; align-self:flex-start\"><span style=\"width:10px; height:10px; background:#FFFBEB; border-radius:2px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-weight:700; font-size:13px; color:#FFFBEB\">22<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:12px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; color:#14231F80\">KEEP FLYING FOR THESE<\u002Fspan>\n        <span style=\"flex:1; height:1px; background:#14231F14\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:12px\">\n        <div style=\"background:#FFFFFF; border-radius:16px; box-shadow:0 5px 0 #14231F0f; padding:11px; display:flex; flex-direction:column; gap:7px\">\n          <span style=\"height:66px; border-radius:11px; background:#A7DED3; display:flex; align-items:center; justify-content:center\"><svg width=\"50\" height=\"42\" sc-camel-view-box=\"0 0 62 52\"><ellipse cx=\"28\" cy=\"30\" rx=\"17\" ry=\"12\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.7\"><\u002Fellipse><circle cx=\"43\" cy=\"19\" r=\"8\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.7\"><\u002Fcircle><path d=\"M50 17 l9 3 -9 3z\" fill=\"#F26B3A\" stroke=\"#14231F\" stroke-width=\"1.9\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.1\">Kestrel<\u002Fspan>\n          <span style=\"font-size:12px; color:#14231F99; line-height:1.4\">Rare · hovers before a stoop<\u002Fspan>\n          <span style=\"display:flex; align-items:center; gap:6px; background:#FBC7A8; border-radius:999px; padding:4px 10px; align-self:flex-start\"><span style=\"width:10px; height:10px; background:#F26B3A; border-radius:2px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-weight:700; font-size:13px\">120 · 8 away<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; border-radius:16px; box-shadow:0 5px 0 #14231F0f; padding:11px; display:flex; flex-direction:column; gap:7px; position:relative\">\n          <span style=\"position:absolute; top:9px; right:9px; background:#A7DED3; border-radius:999px; padding:3px 9px; font-weight:700; font-size:10px\">Summer only<\u002Fspan>\n          <span style=\"height:66px; border-radius:11px; background:#A7DED3; display:flex; align-items:center; justify-content:center\"><svg width=\"50\" height=\"42\" sc-camel-view-box=\"0 0 62 52\"><ellipse cx=\"28\" cy=\"30\" rx=\"17\" ry=\"12\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.7\"><\u002Fellipse><circle cx=\"43\" cy=\"19\" r=\"8\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2.7\"><\u002Fcircle><path d=\"M50 17 l9 3 -9 3z\" fill=\"#F26B3A\" stroke=\"#14231F\" stroke-width=\"1.9\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.1\">Painted Bunting<\u002Fspan>\n          <span style=\"font-size:12px; color:#14231F99; line-height:1.4\">Rare · back next summer<\u002Fspan>\n          <span style=\"display:flex; align-items:center; gap:6px; background:#FBC7A8; border-radius:999px; padding:4px 10px; align-self:flex-start\"><span style=\"width:10px; height:10px; background:#F26B3A; border-radius:2px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-weight:700; font-size:13px\">110<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#064A41; border-radius:16px; padding:11px; display:flex; flex-direction:column; gap:7px\">\n          <span style=\"height:66px; border-radius:11px; background:#0B7A6A; display:flex; align-items:center; justify-content:center\"><svg width=\"38\" height=\"48\" sc-camel-view-box=\"0 0 40 50\"><path d=\"M20 3 C31 13 37 27 37 34 C37 43 29 48 20 48 C11 48 3 43 3 34 C3 27 9 13 20 3Z\" fill=\"#FFFBEB\" stroke=\"#C4471B\" stroke-width=\"2.4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.1; color:#FFFBEB\">Whooping Crane<\u002Fspan>\n          <span style=\"font-size:12px; color:#A7DED3; line-height:1.4\">One of a kind · comes as an egg<\u002Fspan>\n          <span style=\"font-weight:700; font-size:12px; color:#A7DED3\">Already warming · 60%<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#A7DED3; border-radius:14px; padding:12px 16px; font-size:14px; line-height:1.5; font-weight:600\">Every bird here is real, and stars are the only way to bring one home. Nothing in the Meadow can be bought with money.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width:400px; display:flex; flex-direction:column; gap:12px\">\n      <div style=\"background:#FFFBEB; border:2px solid #14231F1a; border-radius:20px; padding:22px; display:flex; flex-direction:column; gap:13px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">THE ONE PURCHASE SCREEN<\u002Fspan>\n        <div style=\"height:150px; border-radius:16px; background:#A7DED3; display:flex; align-items:center; justify-content:center\"><svg width=\"118\" height=\"100\" sc-camel-view-box=\"0 0 62 52\"><ellipse cx=\"28\" cy=\"30\" rx=\"17\" ry=\"12\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2\"><\u002Fellipse><circle cx=\"43\" cy=\"19\" r=\"8\" fill=\"#FBC7A8\" stroke=\"#14231F\" stroke-width=\"2\"><\u002Fcircle><path d=\"M50 17 l9 3 -9 3z\" fill=\"#F26B3A\" stroke=\"#14231F\" stroke-width=\"1.4\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M16 26 q12 -12 24 -2\" fill=\"none\" stroke=\"#14231F\" stroke-width=\"1.8\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div>\n          <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:26px; line-height:1.05\">Barn Owl<\u002Fspan>\n          <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; color:#14231F80; margin-top:5px\">UNCOMMON · HE'LL TAKE A FREE PERCH<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; border-radius:14px; box-shadow:0 4px 0 #14231F0d; padding:12px 14px; font-size:15px; line-height:1.45; font-weight:600\">He flies so quietly that mice never hear him coming.<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:12px; background:#FBC7A8; border-radius:14px; padding:12px 14px\">\n          <span style=\"width:15px; height:15px; background:#F26B3A; border-radius:3px; transform:rotate(45deg); flex:none\"><\u002Fspan>\n          <span style=\"flex:1; font-weight:700; font-size:14px\">55 stars now · {{ starBalance }} left after<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:58px; border-radius:18px; background:#F26B3A; box-shadow:0 5px 0 #C4471B; display:flex; align-items:center; justify-content:center; gap:11px; font-family:Fredoka,sans-serif; font-weight:600; font-size:20px; color:#FFFBEB\">Give him a home<\u002Fdiv>\n        <span style=\"align-self:center; font-weight:700; font-size:15px; color:#0B7A6A\">Not yet<\u002Fspan>\n        <span style=\"font-size:12px; color:#14231F99; line-height:1.45; text-align:center\">His call and the rest of his entry unlock when he moves in.<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showSpecs }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; line-height:1.6; color:#14231F99\">Balance-after is shown before the tap. No confirm-again dialog and no undo prompt — the arrival flight is the receipt. “20 away” replaces any lock icon: the distance shrinks every flight.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"s09\" style=\"padding:56px 64px; display:flex; flex-direction:column; gap:22px; border-bottom:2px solid #14231F1a\">\n  <div style=\"display:flex; align-items:baseline; gap:14px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:#14231F80\">09<\u002Fspan>\n    <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px\">Rarity is what a bird does<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:16px; line-height:1.6; max-width:74ch\">Every bird a kid owns is on its perch every single day — no chance, no roll, nothing to check back for. What a rarer bird buys is behaviour: more to watch, more that answers you, more that changes with the hour. The ladder maps directly to animation budget, which is the honest reason the prices differ.<\u002Fp>\n  <div style=\"display:flex; gap:18px; flex-wrap:wrap\">\n    <div style=\"width:290px; background:#FFFBEB; border:2px solid #14231F1a; border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:11px; box-sizing:border-box\">\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">GOOD COMPANY<\u002Fspan>\n      <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:23px; line-height:1.05\">Common<\u002Fspan>\n      <span style=\"display:flex; align-items:center; gap:8px; align-self:flex-start; background:#FBC7A8; border-radius:999px; padding:5px 12px\"><span style=\"width:11px; height:11px; background:#F26B3A; border-radius:2px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-weight:700; font-size:13px\">15–25<\u002Fspan><\u002Fspan>\n      <span style=\"font-size:14px; line-height:1.5; font-weight:700\">One idle and one play loop.<\u002Fspan>\n      <span style=\"font-size:13px; line-height:1.5; color:#14231F99\">Bobs on its perch, wanders to the feeder now and then. The backbone of a young meadow.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:290px; background:#A7DED3; border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:11px; box-sizing:border-box\">\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#064A41\">HAS A TRICK<\u002Fspan>\n      <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:23px; line-height:1.05\">Uncommon<\u002Fspan>\n      <span style=\"display:flex; align-items:center; gap:8px; align-self:flex-start; background:#FFFBEB; border-radius:999px; padding:5px 12px\"><span style=\"width:11px; height:11px; background:#F26B3A; border-radius:2px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-weight:700; font-size:13px\">40–60<\u002Fspan><\u002Fspan>\n      <span style=\"font-size:14px; line-height:1.5; font-weight:700\">A signature move, three or four times a session.<\u002Fspan>\n      <span style=\"font-size:13px; line-height:1.5; color:#14231F99\">The kingfisher dives at the pond, the woodpecker drums the trunk, the swallow loops the zone. You learn to wait for it.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:290px; background:#FBC7A8; border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:11px; box-sizing:border-box\">\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#C4471B\">PUTS ON A SHOW<\u002Fspan>\n      <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:23px; line-height:1.05\">Rare<\u002Fspan>\n      <span style=\"display:flex; align-items:center; gap:8px; align-self:flex-start; background:#FFFBEB; border-radius:999px; padding:5px 12px\"><span style=\"width:11px; height:11px; background:#F26B3A; border-radius:2px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-weight:700; font-size:13px\">90–130<\u002Fspan><\u002Fspan>\n      <span style=\"font-size:14px; line-height:1.5; font-weight:700\">A signature move, a reaction to you, and an hour that is hers.<\u002Fspan>\n      <span style=\"font-size:13px; line-height:1.5; color:#14231F99\">The kestrel hovers dead still before a stoop. Tap her and she answers. Nearby birds scatter when she lands, and she hunts at dusk.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:290px; background:#064A41; border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:11px; box-sizing:border-box\">\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#A7DED3\">ONE OF A KIND<\u002Fspan>\n      <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:23px; line-height:1.05; color:#FFFBEB\">Legendary<\u002Fspan>\n      <span style=\"display:flex; align-items:center; gap:8px; align-self:flex-start; background:#0B7A6A; border-radius:999px; padding:5px 12px\"><span style=\"width:11px; height:11px; background:#F26B3A; border-radius:2px; transform:rotate(45deg)\"><\u002Fspan><span style=\"font-weight:700; font-size:13px; color:#FFFBEB\">egg only<\u002Fspan><\u002Fspan>\n      <span style=\"font-size:14px; line-height:1.5; font-weight:700; color:#FFFBEB\">All of the above, plus a moment no other bird has.<\u002Fspan>\n      <span style=\"font-size:13px; line-height:1.5; color:#A7DED3\">The crane dances — a ten-second display, a few times a week, that stops the meadow to watch. Hatched and named by the kid.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <ul style=\"margin:0; padding-left:20px; font-size:15px; line-height:1.7; max-width:74ch\">\n    <li><strong>Seasonal migrants are the only empty perch in the app<\u002Fstrong>, which is exactly what makes that absence read as travel rather than loss.<\u002Fli>\n    <li><strong>Rare behaviour never demands attention.<\u002Fstrong> No badge, no notification, no “you missed it”. The kestrel hovers whether or not anyone is watching.<\u002Fli>\n    <li><strong>Any bird, any time.<\u002Fstrong> A kid can save 180 stars for a legendary instead of five commons, and nothing throttles or nudges them out of it.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div id=\"s10\" style=\"padding:56px 64px; display:flex; flex-direction:column; gap:22px; border-bottom:2px solid #14231F1a; background:#14231F08\">\n  <div style=\"display:flex; align-items:baseline; gap:14px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:#14231F80\">10<\u002Fspan>\n    <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px\">Eggs and the hatching<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:16px; line-height:1.6; max-width:74ch\">Legendary birds are never bought. An egg arrives, warms as the kid flies, and waits at full warmth until they choose to hatch it. This is the longest ceremony in the app and the only place a kid names anything.<\u002Fp>\n\n  <div style=\"display:flex; gap:14px; flex-wrap:wrap\">\n    <div style=\"flex:1; min-width:250px; background:#FFFBEB; border:2px solid #14231F1a; border-radius:16px; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">BEAT 1 · IT WAITS<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:6px; line-height:1.15\">The egg is ready<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.55; margin-top:6px\">At 100% warmth it stops filling and gains a slow 3s glow. No badge, no dialog, no timer. It will sit there for a week if that is what the kid wants.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:250px; background:#FFFBEB; border:2px solid #14231F1a; border-radius:16px; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">BEAT 2 · 0 → 1.5s<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:6px; line-height:1.15\">It rocks, then cracks<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.55; margin-top:6px\">Three rocks of ±6°, then two cracks draw on 300ms apart with a 3px shiver each. A soft tap per crack — the only percussive audio in the app.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:250px; background:#FFFBEB; border:2px solid #14231F1a; border-radius:16px; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">BEAT 3 · 1.5 → 3s<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:6px; line-height:1.15\">The chick<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.55; margin-top:6px\">The shell falls open in two halves. She appears at 0.6 scale, wobbles once, and the scene dims to 30% behind her — the only time the app dims that far.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:250px; background:#FBC7A8; border-radius:16px; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#C4471B\">BEAT 4 · WAITS FOR THE KID<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:6px; line-height:1.15\">You name her<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.55; margin-top:6px\">Suggestion chips keep pre-readers moving; typing is optional. No character limit shown, no validation message — anything they type is accepted.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:250px; background:#FFFBEB; border:2px solid #14231F1a; border-radius:16px; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">BEAT 5 · 0 → 2s<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:6px; line-height:1.15\">First flight<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.55; margin-top:6px\">She flies from the shell to the Nest in a shallow arc, lands, hops once, and her name bubble holds 2s. The scene lifts back to full brightness as she lands.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:250px; background:#A7DED3; border-radius:16px; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#064A41\">BEAT 6 · AFTER<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:6px; line-height:1.15\">She joins the flock<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.55; margin-top:6px\">Her chosen name rides on her tap bubble and in the flock strip. Her guide entry is the real species like every other, with Rename kept as an action in its foot.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <ul style=\"margin:0; padding-left:20px; font-size:15px; line-height:1.7; max-width:74ch\">\n    <li>~9s watched, ~2s skipped. Beats 2, 3 and 5 are skippable with a tap; 1, 4 and 6 wait for the kid.<\u002Fli>\n    <li>If the app closes mid-ceremony the egg returns to “ready”. Nothing is lost and it can be hatched again from beat 1.<\u002Fli>\n    <li>One egg incubates at a time, and the next cannot be earned until this chick has landed.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div id=\"s11\" style=\"padding:56px 64px; display:flex; flex-direction:column; gap:22px; border-bottom:2px solid #14231F1a\">\n  <div style=\"display:flex; align-items:baseline; gap:14px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:#14231F80\">11<\u002Fspan>\n    <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px\">The leaving, and the coming back<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:16px; line-height:1.6; max-width:74ch\">At the turn of a season the visiting birds migrate. This is the only moment the app removes something a child earned, so it is a goodbye with a promise: they are warned, they get to watch, the entry stays, and the return is a real event months later.<\u002Fp>\n  <div style=\"display:flex; gap:14px; flex-wrap:wrap\">\n    <div style=\"flex:1; min-width:250px; background:#FFFBEB; border:2px solid #14231F1a; border-radius:16px; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">7 DAYS OUT<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:6px; line-height:1.15\">A week of restlessness<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.55; margin-top:6px\">The leaving birds bob faster and hop between perches more often. Their entry gains one line: “She is getting ready to go south.” No countdown.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:250px; background:#FFFBEB; border:2px solid #14231F1a; border-radius:16px; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">ON OPEN<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:6px; line-height:1.15\">The morning they go<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.55; margin-top:6px\">One gentle prompt: “Rusty is leaving today. Come and see him off?” — and “Later today” genuinely defers, until the kid watches or the next day comes.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:250px; background:#FBC7A8; border-radius:16px; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#C4471B\">0 → 3s<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:6px; line-height:1.15\">The circle and the V<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.55; margin-top:6px\">He lifts off, circles the zone once so the kid can follow him, then joins a V of silhouettes crossing the sky. Autumn's only sky event.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:250px; background:#FFFBEB; border:2px solid #14231F1a; border-radius:16px; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">AFTER<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:6px; line-height:1.15\">His perch, and his page<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.55; margin-top:6px\">His perch stays his and stays empty — nobody takes it. The entry stays fully readable, call and all, with a Seafoam “Away · back in spring” chip. He never leaves the flock count.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:250px; background:#A7DED3; border-radius:16px; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#064A41\">NEXT SEASON<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:6px; line-height:1.15\">He comes back<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.55; margin-top:6px\">First open of the new season: he flies in along the same arc, lands on the perch that was his, and the chip clears. Returning uses the arrival animation, so it feels like arriving.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:250px; background:#FFFBEB; border:2px solid #14231F1a; border-radius:16px; padding:18px\">\n      <span style=\"display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; color:#14231F80\">MEANWHILE<\u002Fspan>\n      <span style=\"display:block; font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; margin-top:6px; line-height:1.15\">The ones who stayed<\u002Fspan>\n      <span style=\"display:block; font-size:14px; line-height:1.55; margin-top:6px\">Residents never leave. After a departure the guide surfaces one line about who stayed and why — how a kid learns the difference between a migrant and a resident without being taught it.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <ul style=\"margin:0; padding-left:20px; font-size:15px; line-height:1.7; max-width:74ch\">\n    <li>Only species that actually migrate ever leave, and never more than two in one season change.<\u002Fli>\n    <li>A bird away on migration still counts toward zone unlocks and the flock total. Nothing regresses.<\u002Fli>\n    <li>Miss the departure entirely and you open to an empty perch, the chip, and one line of explanation. There is no missed-event screen.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div id=\"s12\" style=\"padding:56px 64px; display:flex; flex-direction:column; gap:22px; border-bottom:2px solid #14231F1a; background:#14231F08\">\n  <div style=\"display:flex; align-items:baseline; gap:14px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:#14231F80\">12<\u002Fspan>\n    <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px\">Four seasons<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:16px; line-height:1.6; max-width:74ch\">A season changes exactly three things: the canopy and ground tint, one drifting particle, and which visitor is in the store. Birds and interface never retint, so nothing has to be drawn four times.<\u002Fp>\n  <div style=\"display:flex; gap:18px; flex-wrap:wrap\">\n    <div style=\"width:270px; display:flex; flex-direction:column; gap:10px\">\n      <div style=\"height:110px; border-radius:14px; background:#CFEDE5; position:relative; overflow:hidden\">\n        <div style=\"position:absolute; left:0; right:0; bottom:0; height:44px; background:#7FCFBE\"><\u002Fdiv>\n        <div style=\"position:absolute; left:96px; top:22px; width:78px; height:52px; border-radius:50%; background:#8FD9C8\"><\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:20px\">Spring · First Light<\u002Fspan>\n      <span style=\"font-size:14px; line-height:1.5\">Blossom on the canopy, petals drifting. “Everyone is building a nest.”<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; color:#14231F99; line-height:1.6\">CANOPY #8FD9C8 · GROUND #7FCFBE<br>PETALS · BARN SWALLOW<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:270px; display:flex; flex-direction:column; gap:10px\">\n      <div style=\"height:110px; border-radius:14px; background:#A7DED3; position:relative; overflow:hidden\">\n        <div style=\"position:absolute; left:0; right:0; bottom:0; height:44px; background:#6FC3B2\"><\u002Fdiv>\n        <div style=\"position:absolute; left:96px; top:20px; width:82px; height:56px; border-radius:50%; background:#3E9E8E\"><\u002Fdiv>\n        <div style=\"position:absolute; right:18px; top:14px; width:34px; height:34px; border-radius:50%; background:#FBC7A8\"><\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:20px\">Summer · Long Days<\u002Fspan>\n      <span style=\"font-size:14px; line-height:1.5\">Deep green, high sun, dandelion seeds. “The meadow stays light late.”<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; color:#14231F99; line-height:1.6\">CANOPY #3E9E8E · GROUND #6FC3B2<br>SEEDS · PAINTED BUNTING · NIGHT AT 9PM<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:270px; display:flex; flex-direction:column; gap:10px\">\n      <div style=\"height:110px; border-radius:14px; background:#FBC7A8; position:relative; overflow:hidden\">\n        <div style=\"position:absolute; left:0; right:0; bottom:0; height:44px; background:#F0A47A\"><\u002Fdiv>\n        <div style=\"position:absolute; left:96px; top:22px; width:80px; height:54px; border-radius:50%; background:#F26B3A\"><\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:20px\">Autumn · The Leaving<\u002Fspan>\n      <span style=\"font-size:14px; line-height:1.5\">Sun-coloured canopy, leaves falling, a V of cranes crossing the sky. “Some birds are going south.”<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; color:#14231F99; line-height:1.6\">CANOPY #F26B3A · GROUND #F0A47A<br>LEAVES · SANDHILL CRANE · THE ONLY SKY EVENT<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:270px; display:flex; flex-direction:column; gap:10px\">\n      <div style=\"height:110px; border-radius:14px; background:#DCEDF2; position:relative; overflow:hidden\">\n        <div style=\"position:absolute; left:0; right:0; bottom:0; height:44px; background:#FFFBEB\"><\u002Fdiv>\n        <div style=\"position:absolute; left:120px; top:26px; width:6px; height:48px; background:#C99A6B\"><\u002Fdiv>\n        <div style=\"position:absolute; left:104px; top:34px; width:40px; height:4px; background:#C99A6B; transform:rotate(-24deg)\"><\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-family:Fredoka,sans-serif; font-weight:600; font-size:20px\">Winter · Quiet Meadow<\u002Fspan>\n      <span style=\"font-size:14px; line-height:1.5\">Bare branches, snow on the ground, the pond frozen still. “The ones who stayed are tough.”<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; color:#14231F99; line-height:1.6\">SKY #DCEDF2 · GROUND #FFFBEB<br>SNOW · SNOWY OWL · RIPPLE STOPS<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <ul style=\"margin:0; padding-left:20px; font-size:15px; line-height:1.7; max-width:74ch\">\n    <li>The season follows the device calendar, changes on first open of the new quarter, and plays as a 1.5s cross-fade of the canopy and ground layers only.<\u002Fli>\n    <li>Each seasonal visitor can be given a home during its season and returns the same time next year. The store says “back next summer”, never a countdown.<\u002Fli>\n    <li>Night is a palette swap after 7pm (9pm in summer): Deep Teal, birds asleep as silhouettes, only the owl awake. Arrivals wait for morning.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div id=\"s13\" style=\"padding:56px 64px; display:flex; flex-direction:column; gap:22px; border-bottom:2px solid #14231F1a\">\n  <div style=\"display:flex; align-items:baseline; gap:14px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:#14231F80\">13<\u002Fspan>\n    <h2 style=\"margin:0; font-family:Fredoka,sans-serif; font-weight:600; font-size:32px\">The roster — all 22 birds<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:16px; line-height:1.6; max-width:74ch\">Every species is real and native to North America, chosen so a kid meets a common garden bird first and a continental rarity last. Prices are the design targets; the signature move is what the tier actually buys. Six of the twenty-two migrate, and those are the only birds whose perch is ever empty.<\u002Fp>\n\n  <div style=\"max-width:1240px; border:2px solid #14231F14; border-radius:18px; overflow:hidden\">\n    <div style=\"display:grid; grid-template-columns:250px 130px 110px 1fr 140px; background:#14231F; color:#FFFBEB; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em\">\n      <span style=\"padding:11px 14px\">SPECIES<\u002Fspan><span style=\"padding:11px 14px\">TIER<\u002Fspan><span style=\"padding:11px 14px\">STARS<\u002Fspan><span style=\"padding:11px 14px\">WHAT IT DOES<\u002Fspan><span style=\"padding:11px 14px\">HERE WHEN<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:250px 130px 110px 1fr 140px\">\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.2\">Skylark<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent\"><span style=\"display:inline-block; background:#FFFFFF; color:#14231F; border:1.5px solid #14231F1a; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Common<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; display:flex; align-items:center; gap:7px\"><span style=\"font-weight:700; font-size:13px; color:#14231F99\">Starter<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-size:14px; line-height:1.5\">Arrives with you on day one. Sings on the wing.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent\"><span style=\"display:inline-block; background:#14231F0a; color:#14231F99; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">All year<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.2\">House Finch<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#FFFFFF; color:#14231F; border:1.5px solid #14231F1a; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Common<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; display:flex; align-items:center; gap:7px\"><span style=\"width:11px; height:11px; background:#F26B3A; border-radius:2px; transform:rotate(45deg); flex:none\"><\u002Fspan><span style=\"font-weight:700; font-size:14px\">15<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-size:14px; line-height:1.5\">Idle and feeder loops.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#14231F0a; color:#14231F99; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">All year<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.2\">Mourning Dove<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent\"><span style=\"display:inline-block; background:#FFFFFF; color:#14231F; border:1.5px solid #14231F1a; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Common<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; display:flex; align-items:center; gap:7px\"><span style=\"width:11px; height:11px; background:#F26B3A; border-radius:2px; transform:rotate(45deg); flex:none\"><\u002Fspan><span style=\"font-weight:700; font-size:14px\">16<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-size:14px; line-height:1.5\">Idle and ground loops.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent\"><span style=\"display:inline-block; background:#14231F0a; color:#14231F99; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">All year<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.2\">Black-capped Chickadee<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#FFFFFF; color:#14231F; border:1.5px solid #14231F1a; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Common<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; display:flex; align-items:center; gap:7px\"><span style=\"width:11px; height:11px; background:#F26B3A; border-radius:2px; transform:rotate(45deg); flex:none\"><\u002Fspan><span style=\"font-weight:700; font-size:14px\">18<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-size:14px; line-height:1.5\">Idle and feeder loops.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#14231F0a; color:#14231F99; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">All year<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.2\">House Wren<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent\"><span style=\"display:inline-block; background:#FFFFFF; color:#14231F; border:1.5px solid #14231F1a; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Common<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; display:flex; align-items:center; gap:7px\"><span style=\"width:11px; height:11px; background:#F26B3A; border-radius:2px; transform:rotate(45deg); flex:none\"><\u002Fspan><span style=\"font-weight:700; font-size:14px\">18<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-size:14px; line-height:1.5\">Idle and dust-patch loops.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent\"><span style=\"display:inline-block; background:#14231F0a; color:#14231F99; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">All year<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.2\">American Robin<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#FFFFFF; color:#14231F; border:1.5px solid #14231F1a; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Common<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; display:flex; align-items:center; gap:7px\"><span style=\"width:11px; height:11px; background:#F26B3A; border-radius:2px; transform:rotate(45deg); flex:none\"><\u002Fspan><span style=\"font-weight:700; font-size:14px\">20<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-size:14px; line-height:1.5\">Idle and bath loops.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#14231F0a; color:#14231F99; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">All year<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-fam ><span style=\"font-weight:700; font-size:14px\">22<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-size:14px; line-height:1.5\">Idle and feeder loops.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#14231F0a; color:#14231F99; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">All year<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.2\">Downy Woodpecker<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent\"><span style=\"display:inline-block; background:#A7DED3; color:#14231F; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Uncommon<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; display:flex; align-items:center; gap:7px\"><span style=\"width:11px; height:11px; background:#F26B3A; border-radius:2px; transform:rotate(45deg); flex:none\"><\u002Fspan><span style=\"font-weight:700; font-size:14px\">40<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-size:14px; line-height:1.5\">Drums the trunk — the sound carries across the zone.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent\"><span style=\"display:inline-block; background:#14231F0a; color:#14231F99; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">All year<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-family:Fredoka,sans-serif; fo -size:14px\">45<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-size:14px; line-height:1.5\">Screams like a hawk and the small birds duck.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent\"><span style=\"display:inline-block; background:#14231F0a; color:#14231F99; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">All year<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-family:Fredoka,sans-serif; font-weight:600; font-size:16px; line-height:1.2\">Ruby-throated Hummingbird<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#A7DED3; color:#14231F; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Uncommon<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; display:flex; align-items:center; gap:7px\"><span style=\"width:11px; height:11px; background:#F26B3A; border-radius:2px; transform:rotate(45deg); flex:none\"><\u002Fspan><span style=\"font-weight:700; font-size:14px\">46<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05; font-size:14px; line-height:1.5\">Hangs still at a flower, then vanishes sideways.<\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:#14231F05\"><span style=\"display:inline-block; background:#FBC7A8; border-radius:999px; padding:3px 10px; font-weight:700; font-size:12px; white-space:nowrap\">Spring–autumn<\u002Fspan><\u002Fspan>\n      <span style=\"padding:11px 14px; border-top:1px solid #14231F0f; background:transparent; font-family:Fredoka,sans-serif; font-weight:600; font-size:1
